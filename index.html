      state.chat.push({ role:'assistant', content: 'Error: '+e.message, at: new Date().toISOString(), error: true });

      if (state.logYearsLoaded.indexOf(y) >= 0){
        logEntriesForYear(y).forEach(function(e){
          if (!byDate[e.dateFor]) byDate[e.dateFor] = [];
          byDate[e.dateFor].push(e);
        });
      }
    });
    var dates = Object.keys(byDate).sort().reverse();
    var groupsHtml = dates.map(function(d){
      var entries = byDate[d].slice().sort(function(a,b){ return b.createdAt < a.createdAt ? -1:1; });
      return '<div style="margin-bottom:18px;" id="log-day-'+d+'" class="log-day'+(state.logFocus === d ? ' log-focus' : '')+'">' +
        '<div class="log-date-head">'+prettyDate(d)+' <button class="link-btn" style="margin-left:6px;text-transform:none;letter-spacing:0;" data-act="log-to-cal" data-d="'+d+'">see on calendar</button></div>' +
        entries.map(logRowHtml).join('') +
      '</div>';
    }).join('');

    var unloadedYears = state.logYearsAvailable.filter(function(y){ return state.logYearsLoaded.indexOf(y)===-1; });
    var loadMoreHtml = unloadedYears.length ?
      '<div style="text-align:center;margin-top:10px;"><button class="link-btn" data-action="load-log-year" data-year="'+unloadedYears[0]+'">load '+unloadedYears[0]+'</button></div>' : '';

    return '' +
      '<h2 class="section-title">Log</h2>' +
      '<p class="section-sub">Write something down and it stays. Editable for 24 hours, then permanent, no exceptions.</p>' +
      '<div class="inline-form">' +
        '<div class="field-row"><div><span class="field-label">About date</span><input type="date" id="logDate" value="'+state.today+'"></div></div>' +
        '<textarea class="reflect" id="logText" style="width:100%;min-height:70px;margin-top:0;" placeholder="What do you want on the record?"></textarea>' +
        '<div style="margin-top:8px;"><button class="btn small" data-action="save-log">Save entry</button></div>' +
      '</div>' +
      (dates.length ? groupsHtml : '<div class="empty">Nothing written yet.</div>') +
      loadMoreHtml;
  }

  function findLogEntry(id){
    for (var y in state.logYears){
      var list = state.logYears[y];
      for (var i=0;i<list.length;i++){ if(list[i].id===id) return {entry:list[i], year:y}; }
    }
    return null;
  }
  function handleSaveLog(){
    var dateInput = document.getElementById('logDate');
    var textInput = document.getElementById('logText');
    var text = (textInput.value||'').trim();
    if (!text) return;
    var dateFor = dateInput.value || state.today;
    var now = new Date();
    var year = String(now.getFullYear());
    if (state.logYearsLoaded.indexOf(year) === -1){
      state.logYears[year] = []; state.logYearsLoaded.push(year);
      if(state.logYearsAvailable.indexOf(year)===-1) state.logYearsAvailable.push(year);
    }
    var entry = { id: uid(), dateFor: dateFor, text: text.slice(0,600), createdAt: now.toISOString(), editedAt: null };
    state.logYears[year].push(entry);
    saveLogYear(year);
    render();
    toast('Locked in. Editable for 24 hours.');
    say('logSaved');
  }
  function handleEditLog(id){
    var found = findLogEntry(id);
    if (!found) return;
    var createdMs = new Date(found.entry.createdAt).getTime();
    if (Date.now() >= createdMs + 24*3600*1000){ toast('This entry is locked'); return; }
    state.editingLogId = id;
    render();
  }
  function handleSaveLogEdit(id){
    var found = findLogEntry(id);
    if (!found) return;
    var ta = document.getElementById('editLogText');
    var text = (ta.value||'').trim();
    if (!text) return;
    found.entry.text = text.slice(0,600);
    found.entry.editedAt = new Date().toISOString();
    state.editingLogId = null;
    saveLogYear(found.year);
    render();
  }
  function handleDeleteLog(id){
    var found = findLogEntry(id);
    if (!found) return;
    var createdMs = new Date(found.entry.createdAt).getTime();
    if (Date.now() >= createdMs + 24*3600*1000){ toast('This entry is locked and cannot be deleted'); return; }
    showConfirm('Delete this entry?', 'It is still inside the 24 hour window, so this is allowed. After that it cannot be undone.', function(){
      state.logYears[found.year] = state.logYears[found.year].filter(function(x){return x.id!==id;});
      saveLogYear(found.year);
      render();
    });
  }

  /* ---------------- History ---------------- */
  function sumRange(summary, startDate, endDate){
    var planned=0, completed=0, closedDays=0, perfectDays=0;
    var d = startDate;
    while (d <= endDate){
      for (var i=0;i<summary.length;i++){
        if (summary[i].date===d){
          planned += summary[i].planned; completed += summary[i].completed;
          if (summary[i].closedOut) closedDays++;
          if (summary[i].planned>0 && summary[i].completed>=summary[i].planned) perfectDays++;
          break;
        }
      }
      d = addDays(d,1);
    }
    return { planned:planned, completed:completed, rate: planned? Math.round(completed/planned*100):0, closedDays:closedDays, perfectDays:perfectDays };
  }

  function historyDetailRowHtml(date){
    var rec = state.historyDayCache[date];
    var body;
    if (rec === undefined){
      body = '<div class="empty" style="padding:16px;">Loading…</div>';
    } else if (!rec || !rec.tasks || rec.tasks.length===0){
      body = '<div class="empty" style="padding:16px;">Nothing was written down this day.</div>';
    } else {
      body = rec.tasks.map(function(t){
        var g = t.goalRef ? findGoal(t.goalRef) : null;
        var mark = t.completed ? '<span style="color:var(--teal);font-weight:600;">&#10003;</span>' : '<span style="color:var(--ink-faint);">&#9675;</span>';
        var weightTag = (t.weight && t.weight!==2) ? '<span class="row-tag" style="background:var(--sheet-2);color:var(--ink-soft);">'+(t.weight===1?'quick':'big promise')+'</span>' : '';
        var goalTag = g ? '<span class="row-tag">'+(t.goalRef.type==='long'?'&#9670; ':'&middot; ')+escapeHtml(g.title)+'</span>' : (t.goalRef ? '<span class="row-tag" style="opacity:.6;">linked goal (removed)</span>' : '');
        return '<div style="display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--rule);">' +
          '<div style="width:16px;flex-shrink:0;padding-top:1px;">'+mark+'</div>' +
          '<div style="flex:1;"><div style="font-size:13.5px;'+(t.completed?'color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--rule-strong);':'')+'">'+escapeHtml(t.text)+'</div>'+goalTag+weightTag+'</div>' +
        '</div>';
      }).join('');
      if (rec.reflection){
        body += '<div class="section-sub" style="margin-top:10px;margin-bottom:0;">Note: '+escapeHtml(rec.reflection)+'</div>';
      }
    }
    return '<tr class="hist-detail-row"><td colspan="5" style="background:var(--sheet-2);">' +
      '<div style="padding:10px 6px;">' +
        '<div style="font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;">what was written that day &middot; read-only</div>' +
        body +
      '</div>' +
    '</td></tr>';
  }

  async function toggleHistoryDetail(date){
    if (state.expandedHistoryDate === date){
      state.expandedHistoryDate = null;
      render();
      return;
    }
    state.expandedHistoryDate = date;
    render();
    if (!(date in state.historyDayCache)){
      var rec = await safeGet('day:'+date, null);
      state.historyDayCache[date] = rec;
      render();
    }
  }

  function renderHistory(stats){
    var days = 98;
    var cells = [];
    for (var i=days-1; i>=0; i--){
      var d = addDays(state.today, -i);
      var e = null;
      for (var j=0;j<stats.summary.length;j++){ if(stats.summary[j].date===d){ e=stats.summary[j]; break; } }
      cells.push({ date:d, e:e });
    }
    var heatHtml = cells.map(function(c){
      var color = 'var(--sheet-2)';
      var title = c.date+': no entry';
      if (c.e && c.e.planned>0){
        var r = c.e.rate;
        color = r>=1 ? 'var(--teal)' : r>=0.5 ? 'var(--brass)' : 'var(--brick)';
        title = c.date+': '+c.e.completed+'/'+c.e.planned+' kept';
      } else if (c.e && c.e.closedOut){
        color = 'var(--rule-strong)';
        title = c.date+': closed, nothing planned';
      }
      return '<div class="heat-cell" style="background:'+color+'" title="'+title+'"></div>';
    }).join('');

    var thisWeekStart = addDays(state.today, -6);
    var thisWeek = sumRange(stats.summary, thisWeekStart, state.today);
    var lastWeekEnd = addDays(thisWeekStart, -1);
    var lastWeekStart = addDays(lastWeekEnd, -6);
    var lastWeek = sumRange(stats.summary, lastWeekStart, lastWeekEnd);
    var trend = thisWeek.rate - lastWeek.rate;
    var trendText = trend===0 ? 'flat vs the previous 7 days' : ((trend>0?'+':'')+trend+' pts vs the previous 7 days');
    var trendColor = trend>0 ? 'var(--teal)' : (trend<0 ? 'var(--brick)' : 'var(--ink-soft)');
    var digestHtml = '' +
      '<div style="border:1px solid var(--rule-strong);border-radius:var(--radius);padding:14px 16px;background:var(--sheet-2);margin-bottom:20px;">' +
        '<div class="group-label" style="margin-bottom:8px;">Last 7 days</div>' +
        '<div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;">' +
          '<div style="font-family:var(--font-mono);font-size:26px;font-weight:600;">'+thisWeek.rate+'%</div>' +
          '<div style="font-family:var(--font-mono);font-size:12.5px;color:'+trendColor+';">'+trendText+'</div>' +
        '</div>' +
        '<p class="section-sub" style="margin:6px 0 0;">'+thisWeek.completed+'/'+thisWeek.planned+' kept &middot; showed up '+thisWeek.closedDays+'/7 &middot; perfect '+thisWeek.perfectDays+'/7</p>' +
      '</div>';

    var visibleEntries = stats.summary.slice().reverse().slice(0, state.historyRowLimit);
    var recentRows = visibleEntries.map(function(e){
      var rateColor = e.planned===0 ? 'var(--ink-faint)' : (e.rate>=1 ? 'var(--teal)':(e.rate>=0.5?'var(--brass)':'var(--brick)'));
      var rateBg = e.planned===0 ? 'var(--sheet-2)' : (e.rate>=1 ? 'var(--teal-light)':(e.rate>=0.5?'var(--brass-light)':'var(--brick-light)'));
      var row = '<tr class="hist-row" data-action="toggle-history-day" data-date="'+e.date+'">' +
        '<td>'+prettyDate(e.date)+'</td><td>'+e.planned+'</td><td>'+e.completed+'</td>' +
        '<td><span class="rate-pill" style="color:'+rateColor+';background:'+rateBg+'">'+pct(e.completed,e.planned)+'%</span></td>' +
        '<td>'+(e.closedOut?'closed':(e.planned>0?'open':'—'))+'</td></tr>';
      if (state.expandedHistoryDate === e.date) row += historyDetailRowHtml(e.date);
      return row;
    }).join('');
    var hasMore = stats.summary.length > state.historyRowLimit;

    return '' +
      '<h2 class="section-title">History</h2>' +
      '<p class="section-sub">Every day gets logged, closed or not. Nothing quietly disappears. Tap a row to see what was actually written that day.</p>' +
      digestHtml +
      '<div class="stat-grid">' +
        '<div class="stat-card"><div class="num">'+stats.showUpStreak+'</div><div class="lbl">Show-up streak</div></div>' +
        '<div class="stat-card"><div class="num">'+stats.perfectStreak+'</div><div class="lbl">Perfect streak</div></div>' +
        '<div class="stat-card"><div class="num">'+stats.showUpBest+'</div><div class="lbl">Best show-up run</div></div>' +
        '<div class="stat-card"><div class="num">'+stats.perfectBest+'</div><div class="lbl">Best perfect run</div></div>' +
        '<div class="stat-card"><div class="num">'+stats.lifetimeRate+'%</div><div class="lbl">Lifetime follow-through</div></div>' +
        '<div class="stat-card"><div class="num">'+stats.weightedRate+'%</div><div class="lbl">Weighted follow-through</div></div>' +
        '<div class="stat-card"><div class="num">'+stats.totalCompleted+'/'+stats.totalPlanned+'</div><div class="lbl">Kept / promised, all time</div></div>' +
      '</div>' +
      '<div class="heat-wrap"><div class="heat-grid">'+heatHtml+'</div>' +
        '<div class="heat-legend">less' +
          '<div class="heat-cell" style="background:var(--sheet-2)"></div>' +
          '<div class="heat-cell" style="background:var(--brick)"></div>' +
          '<div class="heat-cell" style="background:var(--brass)"></div>' +
          '<div class="heat-cell" style="background:var(--teal)"></div>' +
        'more</div>' +
      '</div>' +
      (recentRows ?
        '<table class="hist-table"><thead><tr><th>Date</th><th>Planned</th><th>Kept</th><th>Rate</th><th>Status</th></tr></thead><tbody>'+recentRows+'</tbody></table>' +
        (hasMore ? '<div style="text-align:center;margin-top:10px;"><button class="link-btn" data-action="history-show-more">show more</button></div>' : '')
        : '<div class="empty">No days logged yet. Close out today to start the ledger.</div>');
  }

  function saveGoalForm(type, editingId){
    var title = (document.getElementById('fTitle').value || '').trim();
    if (!title){ toast('Give it a title first'); return; }
    var desc = (document.getElementById('fDesc').value || '').trim();
    var list = type==='long' ? state.goals.longTerm : state.goals.shortTerm;
    if (editingId){
      var g = list.find(function(x){return x.id===editingId;});
      g.title = title; g.description = desc;
      if (type==='long'){ g.targetLabel = document.getElementById('fTarget').value.trim(); g.targetDate = document.getElementById('fDate').value || ''; }
      else { g.targetDate = document.getElementById('fDate').value || ''; g.parentGoalId = document.getElementById('fParent').value || null; }
    } else {
      var obj = { id: uid(), title: title, description: desc, archived:false, createdAt: todayStr(), stats: { planned:0, completed:0 } };
      if (type==='long'){ obj.targetLabel = document.getElementById('fTarget').value.trim(); obj.targetDate = document.getElementById('fDate').value || ''; state.goals.longTerm.push(obj); }

  function weightedRate(tasks){
    var pw = tasks.reduce(function(s,t){ return s+(t.weight||2); }, 0);

  function todayCoachCat(){
    var tasks = state.day.tasks;
    if (state.day.closedOut) return closeCat();
    if (!tasks.length) return 'start';
    var done = tasks.filter(function(t){ return t.completed; }).length;
    if (done === 0) return 'plan';
    if (done === tasks.length) return 'done';
    return weightedRate(tasks) >= 0.75 ? 'near' : 'prog';
  }
  function closeCat(){
    var tasks = state.day.tasks;
    if (!tasks.length) return 'closeE';
    var r = weightedRate(tasks);
    var done = tasks.filter(function(t){ return t.completed; }).length;
    if (done === tasks.length) return 'closeP';
    if (r >= 0.5) return 'closeG';
    if (done > 0) return 'closeL';

  function relativeTime(iso){
    if (!iso) return 'never';
    var days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
    if (days <= 0) return 'today';
    if (days === 1) return 'yesterday';
    if (days < 7) return days+' days ago';
    var weeks = Math.floor(days/7);
    if (weeks < 5) return weeks+' week'+(weeks===1?'':'s')+' ago';
    var months = Math.floor(days/30);
    return months+' month'+(months===1?'':'s')+' ago';
  }

          var ids = {}; (have || []).forEach(function(x){ if (x && x.id) ids[x.id] = true; });
          return (have || []).concat((incoming || []).filter(function(x){ return x && x.id && !ids[x.id]; }));

            existing.forEach(function(en){ existingIds[en.id] = true; });
            var merged = existing.concat(incoming.filter(function(en){ return !existingIds[en.id]; }));

            if (state.logYearsAvailable.indexOf(y) === -1) state.logYearsAvailable.push(y);

        function mergeById(have, incoming){
          var ids = {}; have.forEach(function(x){ if (x && x.id) ids[x.id] = true; });
          return have.concat((incoming || []).filter(function(x){ return x && x.id && !ids[x.id]; }));

        if (data.choreLog && typeof data.choreLog === 'object'){

        if (Array.isArray(data.practiceLog)){ state.practiceLog = mergeById(state.practiceLog, data.practiceLog); await safeSet('meta:practicelog', state.practiceLog); }

  /* ---------------- data safety ----------------
     Rules every update follows:
       1. Updates never delete or rewrite saved keys. New features add new keys
          and fill defaults on load; old fields stay readable.
       2. Before the first launch of a new version, the whole ledger is copied
          into an on-device backup (IndexedDB), plus one copy a day.
       3. A key that cannot be read is set aside, never overwritten blindly.
       4. Reset and restore take a backup first, so both can be undone. */
  var APP_VERSION = '6.4';
  var DATA_VERSION = 2;          // bump only with a migration below
  var BK_DB = 'compound-backups', BK_STORE = 'snaps', BK_KEEP_DAILY = 14, BK_KEEP_OTHER = 12;
  var MIGRATIONS = {
    // 1 -> 2 (v6): chores, skills, reviews and the coach brain are new keys with defaults; nothing to move
    2: async function(){}
  };
  function rawData(){
    var d = {};
    try{ for (var i=0;i<window.localStorage.length;i++){ var k = window.localStorage.key(i); if (k && k.indexOf('compound:') === 0) d[k] = window.localStorage.getItem(k); } }catch(e){}
    return d;
  }
  function snapSummary(data){
    var days = 0, notes = 0, chores = 0, skills = 0, tasks = 0;
    Object.keys(data).forEach(function(k){
      try{
        if (k.indexOf('compound:day:') === 0){ days++; tasks += (JSON.parse(data[k]).tasks || []).length; }
        else if (k === 'compound:meta:notes') notes = JSON.parse(data[k]).length;
        else if (k === 'compound:meta:chores') chores = JSON.parse(data[k]).length;
        else if (k === 'compound:meta:skills') skills = JSON.parse(data[k]).length;
      }catch(e){}
    });
    return days+' days · '+tasks+' tasks · '+chores+' chores · '+skills+' skills · '+notes+' notes';
  }
  function bkOpen(){
    return new Promise(function(resolve, reject){
      if (!window.indexedDB){ reject(new Error('IndexedDB unavailable')); return; }
      var r = window.indexedDB.open(BK_DB, 1);
      r.onupgradeneeded = function(){ if (!r.result.objectStoreNames.contains(BK_STORE)) r.result.createObjectStore(BK_STORE, { keyPath:'id' }); };
      r.onsuccess = function(){ resolve(r.result); };
      r.onerror = function(){ reject(r.error || new Error('IndexedDB open failed')); };
      r.onblocked = function(){ reject(new Error('IndexedDB blocked')); };
    });
  }
  function withTimeout(promise, ms, label){
    return Promise.race([promise, new Promise(function(_, reject){ setTimeout(function(){ reject(new Error((label || 'step')+' timed out')); }, ms); })]);
  }
  async function bkRun(mode, fn){
    var db = await withTimeout(bkOpen(), 2000, 'backup storage');
    return new Promise(function(resolve, reject){
      var tx = db.transaction(BK_STORE, mode), req = fn(tx.objectStore(BK_STORE));
      tx.oncomplete = function(){ db.close(); resolve(req ? req.result : undefined); };
      tx.onerror = tx.onabort = function(){ db.close(); reject(tx.error || new Error('backup failed')); };
    });
  }
  function lsSnapshot(){ try{ var s = JSON.parse(window.localStorage.getItem('compound-backup:last') || 'null'); return s && s.data ? s : null; }catch(e){ return null; } }
  async function listSnapshots(){
    var all = [];
    try{ all = (await bkRun('readonly', function(st){ return st.getAll(); })) || []; }catch(e){}
    var ls = lsSnapshot(); if (ls && !all.some(function(s){ return s.id === ls.id; })) all.push(ls);
    return all.sort(function(a, b){ return a.at < b.at ? 1 : -1; });
  }
  async function pruneSnapshots(){
    var all = await listSnapshots(), daily = 0, other = 0, drop = [];
    all.forEach(function(s){
      if (s.reason === 'daily'){ if (++daily > BK_KEEP_DAILY) drop.push(s.id); }
      else if (++other > BK_KEEP_OTHER) drop.push(s.id);
    });
    if (drop.length) await bkRun('readwrite', function(st){ drop.forEach(function(id){ st.delete(id); }); return null; });
  }
  async function takeSnapshot(reason){
    var data = rawData();
    if (!Object.keys(data).length) return null;
    var snap = { id: new Date().toISOString()+'|'+reason, at: new Date().toISOString(), reason: reason, app: APP_VERSION, data: data };
    try{
      await bkRun('readwrite', function(st){ st.put(snap); return null; });
      try{ await pruneSnapshots(); }catch(e){}
    }catch(e){
      // no IndexedDB: keep the most recent safety copy in local storage if it fits
      try{ window.localStorage.setItem('compound-backup:last', JSON.stringify(snap)); }catch(e2){ return null; }
    }
    return snap;
  }
  async function restoreSnapshot(id){
    var all = await listSnapshots();
    var snap = all.find(function(s){ return s.id === id; });
    if (!snap) throw new Error('That backup is gone.');
    await takeSnapshot('before restore');
    Object.keys(rawData()).forEach(function(k){ window.localStorage.removeItem(k); });
    Object.keys(snap.data).forEach(function(k){ window.localStorage.setItem(k, snap.data[k]); });
    return snap;
  }
  async function guardUpgrade(){
    var hasData = Object.keys(rawData()).length > 0;
    var v = null;
    try{ v = JSON.parse(window.localStorage.getItem('compound:meta:version') || 'null'); }catch(e){}
    if (hasData && (!v || v.app !== APP_VERSION)){
      await takeSnapshot('before update to v'+APP_VERSION+(v && v.app ? ' (from v'+v.app+')' : ''));
    }
    var from = (v && v.data) || 1;
    for (var n = from + 1; n <= DATA_VERSION; n++){ if (MIGRATIONS[n]) await MIGRATIONS[n](); }
    var today = todayStr();
    var last = null; try{ last = window.localStorage.getItem('compound-lastsnap'); }catch(e){}
    if (hasData && last !== today){ if (await takeSnapshot('daily')){ try{ window.localStorage.setItem('compound-lastsnap', today); }catch(e){} } }
    try{ window.localStorage.setItem('compound:meta:version', JSON.stringify({ app: APP_VERSION, data: Math.max(from, DATA_VERSION), updatedAt: new Date().toISOString() })); }catch(e){}
    // ask the browser not to evict this site's storage under pressure
    try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(function(v){ state.persisted = v; }).catch(function(){}); }catch(e){}
  }

  function openBackups(){
    var modalRoot = document.getElementById('modalRoot');
    modalRoot.innerHTML = '<div class="modal-bg" id="modalBg"><div class="modal" role="dialog" aria-label="Backups"><h3>Backups</h3><p>Loading…</p></div></div>';
    listSnapshots().then(function(all){
      var rows = all.length ? all.map(function(s){
        return '<div class="bk-row"><div><b>'+escapeHtml(new Date(s.at).toLocaleString(undefined, { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }))+'</b> · '+escapeHtml(s.reason)+
          '<small>'+escapeHtml(snapSummary(s.data))+' · saved by v'+escapeHtml(s.app || '?')+'</small></div>' +
          '<button class="btn ghost small" data-bk="'+escapeHtml(s.id)+'">Restore</button></div>';
      }).join('') : '<p>No backups yet. One is made the next time the app opens with data in it.</p>';
      modalRoot.innerHTML = '<div class="modal-bg" id="modalBg"><div class="modal" role="dialog" aria-label="Backups">' +
        '<h3>Backups</h3>' +
        '<p>Updates never delete your data. Before every update, and once a day, Compound saves a full copy here on this device. Restoring one makes a copy of the current state first, so it can be undone.</p>' +
        '<p class="ai-note">These copies live on this device only. Deleting the home-screen app or clearing website data removes them too, so download an export file now and then. '+
          (state.persisted === true ? 'This browser has agreed to keep Compound’s storage.' : state.persisted === false ? 'This browser may clear storage when space runs low, so exports matter more here.' : '')+'</p>' +
        '<div class="bk-list">'+rows+'</div>' +
        '<div class="row-btns" style="margin-top:14px;"><button class="btn ghost small" id="bkNow">Back up now</button><button class="btn small" id="bkDone">Done</button></div>' +
      '</div></div>';
      document.getElementById('bkDone').onclick = function(){ modalRoot.innerHTML = ''; };
      document.getElementById('bkNow').onclick = async function(){ await takeSnapshot('manual'); openBackups(); toast('Backup saved on this device'); };
      document.getElementById('modalBg').addEventListener('click', function(e){ if (e.target.id === 'modalBg') modalRoot.innerHTML = ''; });
      modalRoot.querySelectorAll('[data-bk]').forEach(function(b){
        b.onclick = function(){
          var id = b.dataset.bk;
          showConfirm('Restore this backup?', 'Your current data is backed up first, then replaced with this copy. The app reloads after.', async function(){
            try{ await restoreSnapshot(id); toast('Restored. Reloading…'); setTimeout(function(){ try{ window.location.reload(); }catch(e){} }, 400); }
            catch(e){ toast(e.message); }
          });
        };
      });
    });
  }
  document.getElementById('backupsBtn').onclick = openBackups;

  /* ---------------- boot ---------------- */
  (async function boot(){
    // backups must never hold up loading the ledger
    try{ await withTimeout(guardUpgrade(), 3000, 'backup'); }catch(e){}
    await loadAll();
    await loadDayRecs();
    trainBrain();
    rememberLevel();
    render();
    updateBackupLabel();
    setTimeout(function(){ preloadVoice(voiceSettings().gender === 'm' ? 'm' : 'f'); }, 600);
  })();

})();
</script>
