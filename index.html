  /* ---------------- Log ---------------- */
  function logEntriesForYear(y){ return (state.logYears[String(y)]||[]).slice(); }

  function logRowHtml(e){
    var createdMs = new Date(e.createdAt).getTime();
    var unlockMs = createdMs + 24*3600*1000;
    var editable = Date.now() < unlockMs;
    var timeStr = new Date(e.createdAt).toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'});
    if (state.editingLogId === e.id){
      return '<div class="row" style="display:block;">' +
        '<textarea class="reflect" id="editLogText" style="width:100%;margin-top:0;">'+escapeHtml(e.text)+'</textarea>' +
        '<div style="margin-top:6px;display:flex;gap:8px;">' +
          '<button class="btn small" data-action="save-log-edit" data-id="'+e.id+'">Save</button>' +
          '<button class="btn ghost small" data-action="cancel-log-edit">Cancel</button>' +
        '</div></div>';
    }
    return '<div class="row" style="align-items:flex-start;">' +
      '<div class="row-idx" style="width:54px;font-size:11px;">'+timeStr+'</div>' +
      '<div class="row-body"><div class="row-text">'+escapeHtml(e.text)+'</div>' +
        (e.editedAt ? '<span class="row-tag" style="background:var(--sheet-2);color:var(--ink-soft);">edited</span>' : '') +
      '</div>' +
      (editable ?
        '<button class="row-del" style="font-size:12px;" data-action="edit-log" data-id="'+e.id+'">edit</button>' +
        '<button class="row-del" data-action="delete-log" data-id="'+e.id+'">×</button>'
        : '<span title="locked" style="color:var(--ink-faint);flex-shrink:0;">'+lockIcon()+'</span>') +
    '</div>';
  }

  function renderLog(){
    var currentYear = String(new Date().getFullYear());
    var years = state.logYearsAvailable.slice();
    if (years.indexOf(currentYear) === -1) years.unshift(currentYear);
    years = years.filter(function(v,i,a){ return a.indexOf(v)===i; }).sort().reverse();

    var byDate = {};
    years.forEach(function(y){
      if (state.logYearsLoaded.indexOf(y) >= 0){
        logEntriesForYear(y).forEach(function(e){
          if (!byDate[e.dateFor]) byDate[e.dateFor] = [];
          byDate[e.dateFor].push(e);
        });
      }
    });
    var dates = Object.keys(byDate).sort().reverse();
    var groupsHtml = dates.map(function(d){
      var entries = byDate[d].slice().sort(function(a,b){ return b.createdAt < a.createdAt ? -1:1; });
      return '<div style="margin-bottom:18px;">' +
        '<div class="log-date-head">'+prettyDate(d)+'</div>' +
        entries.map(logRowHtml).join('') +
      '</div>';
    }).join('');

    var unloadedYears = state.logYearsAvailable.filter(function(y){ return state.logYearsLoaded.indexOf(y)===-1; });
    var loadMoreHtml = unloadedYears.length ?
      '<div style="text-align:center;margin-top:10px;"><button class="link-btn" data-action="load-log-year" data-year="'+unloadedYears[0]+'">load '+unloadedYears[0]+'</button></div>' : '';

    return '' +
      '<h2 class="section-title">Log</h2>' +
      '<p class="section-sub">Write something down and it stays. Editable for 24 hours, then permanent, no exceptions.</p>' +
      '<div class="inline-form">' +
        '<div class="field-row"><div><span class="field-label">About date</span><input type="date" id="logDate" value="'+state.today+'"></div></div>' +
        '<textarea class="reflect" id="logText" style="width:100%;min-height:70px;margin-top:0;" placeholder="What do you want on the record?"></textarea>' +
        '<div style="margin-top:8px;"><button class="btn small" data-action="save-log">Save entry</button></div>' +
      '</div>' +
      (dates.length ? groupsHtml : '<div class="empty">Nothing written yet.</div>') +
      loadMoreHtml;
  }

  function findLogEntry(id){
    for (var y in state.logYears){
      var list = state.logYears[y];
      for (var i=0;i<list.length;i++){ if(list[i].id===id) return {entry:list[i], year:y}; }
    }
    return null;
  }
  function handleSaveLog(){
    var dateInput = document.getElementById('logDate');
    var textInput = document.getElementById('logText');
    var text = (textInput.value||'').trim();
    if (!text) return;
    var dateFor = dateInput.value || state.today;
    var now = new Date();
    var year = String(now.getFullYear());
    if (state.logYearsLoaded.indexOf(year) === -1){
      state.logYears[year] = []; state.logYearsLoaded.push(year);
      if(state.logYearsAvailable.indexOf(year)===-1) state.logYearsAvailable.push(year);
    }
    var entry = { id: uid(), dateFor: dateFor, text: text.slice(0,600), createdAt: now.toISOString(), editedAt: null };
    state.logYears[year].push(entry);
    saveLogYear(year);
    render();
    toast('Locked in. Editable for 24 hours.');
    say('logSaved');
  }
  function handleEditLog(id){
    var found = findLogEntry(id);
    if (!found) return;
    var createdMs = new Date(found.entry.createdAt).getTime();
    if (Date.now() >= createdMs + 24*3600*1000){ toast('This entry is locked'); return; }
    state.editingLogId = id;
    render();
  }
  function handleSaveLogEdit(id){
    var found = findLogEntry(id);
    if (!found) return;
    var ta = document.getElementById('editLogText');
    var text = (ta.value||'').trim();
    if (!text) return;
    found.entry.text = text.slice(0,600);
    found.entry.editedAt = new Date().toISOString();
    state.editingLogId = null;
    saveLogYear(found.year);
    render();
  }
  function handleDeleteLog(id){
    var found = findLogEntry(id);
    if (!found) return;
    var createdMs = new Date(found.entry.createdAt).getTime();
    if (Date.now() >= createdMs + 24*3600*1000){ toast('This entry is locked and cannot be deleted'); return; }
    showConfirm('Delete this entry?', 'It is still inside the 24 hour window, so this is allowed. After that it cannot be undone.', function(){
      state.logYears[found.year] = state.logYears[found.year].filter(function(x){return x.id!==id;});
      saveLogYear(found.year);
      render();
    });
  }

  /* ---------------- History ---------------- */
  function sumRange(summary, startDate, endDate){
    var planned=0, completed=0, closedDays=0, perfectDays=0;
    var d = startDate;
    while (d <= endDate){
      for (var i=0;i<summary.length;i++){
        if (summary[i].date===d){
          planned += summary[i].planned; completed += summary[i].completed;
          if (summary[i].closedOut) closedDays++;
          if (summary[i].planned>0 && summary[i].completed>=summary[i].planned) perfectDays++;
          break;
        }
      }
      d = addDays(d,1);
    }
    return { planned:planned, completed:completed, rate: planned? Math.round(completed/planned*100):0, closedDays:closedDays, perfectDays:perfectDays };
  }

  function historyDetailRowHtml(date){
    var rec = state.historyDayCache[date];
    var body;
    if (rec === undefined){
      body = '<div class="empty" style="padding:16px;">Loading…</div>';
    } else if (!rec || !rec.tasks || rec.tasks.length===0){
      body = '<div class="empty" style="padding:16px;">Nothing was written down this day.</div>';
    } else {
      body = rec.tasks.map(function(t){
        var g = t.goalRef ? findGoal(t.goalRef) : null;
        var mark = t.completed ? '<span style="color:var(--teal);font-weight:600;">&#10003;</span>' : '<span style="color:var(--ink-faint);">&#9675;</span>';
        var weightTag = (t.weight && t.weight!==2) ? '<span class="row-tag" style="background:var(--sheet-2);color:var(--ink-soft);">'+(t.weight===1?'quick':'big promise')+'</span>' : '';
        var goalTag = g ? '<span class="row-tag">'+(t.goalRef.type==='long'?'&#9670; ':'&middot; ')+escapeHtml(g.title)+'</span>' : (t.goalRef ? '<span class="row-tag" style="opacity:.6;">linked goal (removed)</span>' : '');
        return '<div style="display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--rule);">' +
          '<div style="width:16px;flex-shrink:0;padding-top:1px;">'+mark+'</div>' +
          '<div style="flex:1;"><div style="font-size:13.5px;'+(t.completed?'color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--rule-strong);':'')+'">'+escapeHtml(t.text)+'</div>'+goalTag+weightTag+'</div>' +
        '</div>';
      }).join('');
      if (rec.reflection){
        body += '<div class="section-sub" style="margin-top:10px;margin-bottom:0;">Note: '+escapeHtml(rec.reflection)+'</div>';
      }
    }
    return '<tr class="hist-detail-row"><td colspan="5" style="background:var(--sheet-2);">' +
      '<div style="padding:10px 6px;">' +
        '<div style="font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;">what was written that day &middot; read-only</div>' +
        body +
      '</div>' +
    '</td></tr>';
  }

  async function toggleHistoryDetail(date){
    if (state.expandedHistoryDate === date){
      state.expandedHistoryDate = null;
      render();
      return;
    }
    state.expandedHistoryDate = date;
    render();
    if (!(date in state.historyDayCache)){
      var rec = await safeGet('day:'+date, null);
      state.historyDayCache[date] = rec;
      render();
    }
  }

  function renderHistory(stats){
    var days = 98;
    var cells = [];
    for (var i=days-1; i>=0; i--){
      var d = addDays(state.today, -i);
      var e = null;
      for (var j=0;j<stats.summary.length;j++){ if(stats.summary[j].date===d){ e=stats.summary[j]; break; } }
      cells.push({ date:d, e:e });
    }
    var heatHtml = cells.map(function(c){
      var color = 'var(--sheet-2)';
      var title = c.date+': no entry';
      if (c.e && c.e.planned>0){
        var r = c.e.rate;
        color = r>=1 ? 'var(--teal)' : r>=0.5 ? 'var(--brass)' : 'var(--brick)';
        title = c.date+': '+c.e.completed+'/'+c.e.planned+' kept';
      } else if (c.e && c.e.closedOut){
        color = 'var(--rule-strong)';
        title = c.date+': closed, nothing planned';
      }
      return '<div class="heat-cell" style="background:'+color+'" title="'+title+'"></div>';
    }).join('');

    var thisWeekStart = addDays(state.today, -6);
    var thisWeek = sumRange(stats.summary, thisWeekStart, state.today);
    var lastWeekEnd = addDays(thisWeekStart, -1);
    var lastWeekStart = addDays(lastWeekEnd, -6);
    var lastWeek = sumRange(stats.summary, lastWeekStart, lastWeekEnd);
    var trend = thisWeek.rate - lastWeek.rate;
    var trendText = trend===0 ? 'flat vs the previous 7 days' : ((trend>0?'+':'')+trend+' pts vs the previous 7 days');
    var trendColor = trend>0 ? 'var(--teal)' : (trend<0 ? 'var(--brick)' : 'var(--ink-soft)');
    var digestHtml = '' +
      '<div style="border:1px solid var(--rule-strong);border-radius:var(--radius);padding:14px 16px;background:var(--sheet-2);margin-bottom:20px;">' +
        '<div class="group-label" style="margin-bottom:8px;">Last 7 days</div>' +
        '<div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;">' +
          '<div style="font-family:var(--font-mono);font-size:26px;font-weight:600;">'+thisWeek.rate+'%</div>' +
          '<div style="font-family:var(--font-mono);font-size:12.5px;color:'+trendColor+';">'+trendText+'</div>' +
        '</div>' +
        '<p class="section-sub" style="margin:6px 0 0;">'+thisWeek.completed+'/'+thisWeek.planned+' kept &middot; showed up '+thisWeek.closedDays+'/7 &middot; perfect '+thisWeek.perfectDays+'/7</p>' +
      '</div>';

    var visibleEntries = stats.summary.slice().reverse().slice(0, state.historyRowLimit);
    var recentRows = visibleEntries.map(function(e){
      var rateColor = e.planned===0 ? 'var(--ink-faint)' : (e.rate>=1 ? 'var(--teal)':(e.rate>=0.5?'var(--brass)':'var(--brick)'));
      var rateBg = e.planned===0 ? 'var(--sheet-2)' : (e.rate>=1 ? 'var(--teal-light)':(e.rate>=0.5?'var(--brass-light)':'var(--brick-light)'));
      var row = '<tr class="hist-row" data-action="toggle-history-day" data-date="'+e.date+'">' +
        '<td>'+prettyDate(e.date)+'</td><td>'+e.planned+'</td><td>'+e.completed+'</td>' +
        '<td><span class="rate-pill" style="color:'+rateColor+';background:'+rateBg+'">'+pct(e.completed,e.planned)+'%</span></td>' +
        '<td>'+(e.closedOut?'closed':(e.planned>0?'open':'—'))+'</td></tr>';
      if (state.expandedHistoryDate === e.date) row += historyDetailRowHtml(e.date);
      return row;
    }).join('');
    var hasMore = stats.summary.length > state.historyRowLimit;

    return '' +
      '<h2 class="section-title">History</h2>' +
      '<p class="section-sub">Every day gets logged, closed or not. Nothing quietly disappears. Tap a row to see what was actually written that day.</p>' +
      digestHtml +
      '<div class="stat-grid">' +
        '<div class="stat-card"><div class="num">'+stats.showUpStreak+'</div><div class="lbl">Show-up streak</div></div>' +
        '<div class="stat-card"><div class="num">'+stats.perfectStreak+'</div><div class="lbl">Perfect streak</div></div>' +
        '<div class="stat-card"><div class="num">'+stats.showUpBest+'</div><div class="lbl">Best show-up run</div></div>' +
        '<div class="stat-card"><div class="num">'+stats.perfectBest+'</div><div class="lbl">Best perfect run</div></div>' +
        '<div class="stat-card"><div class="num">'+stats.lifetimeRate+'%</div><div class="lbl">Lifetime follow-through</div></div>' +
        '<div class="stat-card"><div class="num">'+stats.weightedRate+'%</div><div class="lbl">Weighted follow-through</div></div>' +
        '<div class="stat-card"><div class="num">'+stats.totalCompleted+'/'+stats.totalPlanned+'</div><div class="lbl">Kept / promised, all time</div></div>' +
      '</div>' +
      '<div class="heat-wrap"><div class="heat-grid">'+heatHtml+'</div>' +
        '<div class="heat-legend">less' +
          '<div class="heat-cell" style="background:var(--sheet-2)"></div>' +
          '<div class="heat-cell" style="background:var(--brick)"></div>' +
          '<div class="heat-cell" style="background:var(--brass)"></div>' +
          '<div class="heat-cell" style="background:var(--teal)"></div>' +
        'more</div>' +
      '</div>' +
      (recentRows ?
        '<table class="hist-table"><thead><tr><th>Date</th><th>Planned</th><th>Kept</th><th>Rate</th><th>Status</th></tr></thead><tbody>'+recentRows+'</tbody></table>' +
        (hasMore ? '<div style="text-align:center;margin-top:10px;"><button class="link-btn" data-action="history-show-more">show more</button></div>' : '')
        : '<div class="empty">No days logged yet. Close out today to start the ledger.</div>');
  }

        var type = el.dataset.type, id = el.dataset.id;
        var list = type==='long' ? state.goals.longTerm : state.goals.shortTerm;
        var g = list.find(function(x){return x.id===id;});
        g.archived = !g.archived;
        saveGoals(); render();
      };
    });
    root.querySelectorAll('[data-action="delete-goal"]').forEach(function(el){
      el.onclick = function(){
        var type = el.dataset.type, id = el.dataset.id;
        showConfirm('Delete goal?', 'This removes it permanently. Past entries keep their own text either way.', function(){
          if (type==='long'){
            state.goals.longTerm = state.goals.longTerm.filter(function(x){return x.id!==id;});
            state.goals.shortTerm.forEach(function(s){ if(s.parentGoalId===id) s.parentGoalId=null; });
          } else {
            state.goals.shortTerm = state.goals.shortTerm.filter(function(x){return x.id!==id;});
          }
          saveGoals(); render();
        });
      };
    });
    bindFormButtons();

    root.querySelectorAll('[data-action="show-event-form"]').forEach(function(el){
      el.onclick = function(){ document.getElementById('eventForm').innerHTML = eventFormHtml(null); bindEventFormButtons(); };
    });
    root.querySelectorAll('[data-action="edit-event"]').forEach(function(el){
      el.onclick = function(){
        var ev = state.events.find(function(x){return x.id===el.dataset.id;});
        document.getElementById('eventForm').innerHTML = eventFormHtml(ev);
        bindEventFormButtons();
      };
    });
    root.querySelectorAll('[data-action="delete-event"]').forEach(function(el){
      el.onclick = function(){
        var id = el.dataset.id;
        showConfirm('Delete countdown?', 'This removes it for good.', function(){
          state.events = state.events.filter(function(x){return x.id!==id;});
          saveEvents(); render();
        });
      };
    });
    bindEventFormButtons();

    var saveLogBtn = root.querySelector('[data-action="save-log"]'); if (saveLogBtn) saveLogBtn.onclick = handleSaveLog;
    root.querySelectorAll('[data-action="edit-log"]').forEach(function(el){ el.onclick = function(){ handleEditLog(el.dataset.id); }; });
    root.querySelectorAll('[data-action="delete-log"]').forEach(function(el){ el.onclick = function(){ handleDeleteLog(el.dataset.id); }; });
    var saveEditBtn = root.querySelector('[data-action="save-log-edit"]'); if (saveEditBtn) saveEditBtn.onclick = function(){ handleSaveLogEdit(saveEditBtn.dataset.id); };
    var cancelEditBtn = root.querySelector('[data-action="cancel-log-edit"]'); if (cancelEditBtn) cancelEditBtn.onclick = function(){ state.editingLogId=null; render(); };
    var loadYearBtn = root.querySelector('[data-action="load-log-year"]');
    if (loadYearBtn) loadYearBtn.onclick = async function(){ await loadLogYear(loadYearBtn.dataset.year); render(); };
  }

  function bindFormButtons(){
    root.querySelectorAll('[data-action="cancel-form"]').forEach(function(el){
      el.onclick = function(){ document.getElementById(el.dataset.form+'Form').innerHTML = ''; };
    });
    root.querySelectorAll('[data-action="save-goal"]').forEach(function(el){
      el.onclick = function(){ saveGoalForm(el.dataset.type, el.dataset.editing || null); };
    });
  }
  function bindEventFormButtons(){
    var saveBtn = root.querySelector('[data-action="save-event"]');
    if (saveBtn) saveBtn.onclick = function(){ saveEventForm(saveBtn.dataset.editing || null); };
    var cancelBtn = root.querySelector('[data-action="cancel-event-form"]');
    if (cancelBtn) cancelBtn.onclick = function(){ document.getElementById('eventForm').innerHTML=''; };
  }

  function saveGoalForm(type, editingId){
    var title = (document.getElementById('fTitle').value || '').trim();
    if (!title){ toast('Give it a title first'); return; }
    var desc = (document.getElementById('fDesc').value || '').trim();
    var list = type==='long' ? state.goals.longTerm : state.goals.shortTerm;
    if (editingId){
      var g = list.find(function(x){return x.id===editingId;});
      g.title = title; g.description = desc;
      if (type==='long'){ g.targetLabel = document.getElementById('fTarget').value.trim(); g.targetDate = document.getElementById('fDate').value || ''; }
      else { g.targetDate = document.getElementById('fDate').value || ''; g.parentGoalId = document.getElementById('fParent').value || null; }
    } else {
      var obj = { id: uid(), title: title, description: desc, archived:false, createdAt: todayStr(), stats: { planned:0, completed:0 } };
      if (type==='long'){ obj.targetLabel = document.getElementById('fTarget').value.trim(); obj.targetDate = document.getElementById('fDate').value || ''; state.goals.longTerm.push(obj); }
      else { obj.targetDate = document.getElementById('fDate').value || ''; obj.parentGoalId = document.getElementById('fParent').value || null; state.goals.shortTerm.push(obj); }
    }
    saveGoals(); render();
  }

  function saveEventForm(editingId){
    var title = (document.getElementById('evTitle').value || '').trim();
    var date = document.getElementById('evDate').value;
    if (!title || !date){ toast('Title and date are required'); return; }
    var time = document.getElementById('evTime').value || '';
    var note = (document.getElementById('evNote').value || '').trim();
    if (editingId){
      var ev = state.events.find(function(x){return x.id===editingId;});
      ev.title=title; ev.targetDate=date; ev.targetTime=time; ev.note=note;
    } else {
      state.events.push({ id: uid(), title:title, targetDate:date, targetTime:time, note:note, createdAt:new Date().toISOString() });
    }
    saveEvents(); render();
  }

  function handleAddTask(){
    var input = document.getElementById('newTaskInput');
    var sel = document.getElementById('newTaskGoal');
    var weightSel = document.getElementById('newTaskWeight');
    var text = input.value.trim();
    if (!text) return;
    var goalRef = null;
    if (sel.value){ var parts = sel.value.split(':'); goalRef = { type: parts[0], id: parts[1] }; }
    var weight = weightSel ? parseInt(weightSel.value,10) : 2;
    state.day.tasks.push({ id: uid(), text: text.slice(0,140), completed:false, goalRef: goalRef, weight: weight });
    if (goalRef) adjustGoalStat(goalRef, 'planned', 1);
    input.value = '';
    saveDay(); if (goalRef) saveGoals();
    syncTodaySummary(); saveSummary();
    render();
    var el = document.getElementById('newTaskInput'); if (el) el.focus();
  }

  function weightedRate(tasks){
    var pw = tasks.reduce(function(s,t){ return s+(t.weight||2); }, 0);
    var cw = tasks.filter(function(t){ return t.completed; }).reduce(function(s,t){ return s+(t.weight||2); }, 0);
    return pw ? cw/pw : 0;
  }
  function todayCoachCat(){
    var tasks = state.day.tasks;
    if (state.day.closedOut) return closeCat();
    if (!tasks.length) return 'start';
    var done = tasks.filter(function(t){ return t.completed; }).length;
    if (done === 0) return 'plan';
    if (done === tasks.length) return 'done';
    return weightedRate(tasks) >= 0.75 ? 'near' : 'prog';
  }
  function closeCat(){
    var tasks = state.day.tasks;
    if (!tasks.length) return 'closeE';
    var r = weightedRate(tasks);
    var done = tasks.filter(function(t){ return t.completed; }).length;
    if (done === tasks.length) return 'closeP';
    if (r >= 0.5) return 'closeG';
    if (done > 0) return 'closeL';
    return 'closeZ';
  }
  function coachGoalsStatus(){
    var items = departureItems().filter(function(it){ return it.kind === 'goal'; });
    if (!items.length){ toast('Give a goal a target date first'); return; }
    var keys = items.map(function(it){ return it.st.key; });
    var cat = keys.indexOf('final') >= 0 ? 'gFinal' : (keys.indexOf('delayed') >= 0 || keys.indexOf('missed') >= 0) ? 'gDelay' : 'gOn';
    playIds([pickLine(cat)], { force:true });
  }
  function celebrateLevel(el){
    var lvl = levelInfo(computeStats().xp).level;
    xpPop(el, 'Level '+lvl, true);
    chime('level');
    toast('Level '+lvl+' reached');
  }

  function toggleTask(id, el){
    var t = state.day.tasks.find(function(x){return x.id===id;});
    if (!t) return;
    t.completed = !t.completed;
    if (t.goalRef) adjustGoalStat(t.goalRef, 'completed', t.completed ? 1 : -1);
    saveDay(); if (t.goalRef) saveGoals();
    syncTodaySummary(); saveSummary();
    if (t.completed){
      xpPop(el, '+'+taskXp(t)+' xp');
      var leveled = rememberLevel();
      var allDone = state.day.tasks.every(function(x){ return x.completed; });
      var vs = voiceSettings();
      if (leveled) setTimeout(function(){ celebrateLevel(el); }, 350); else chime('up');
      if (allDone) say('done', leveled ? [pickLine('level')] : null);
      else if (leveled) say('level');
      else if (vs.ticks) say(t.weight === 3 ? 'big' : 'tick');
    } else {
      chime('down');
    }
    render();
  }

  /* goal steps */
  function goalById(type, id){
    var list = type === 'long' ? state.goals.longTerm : state.goals.shortTerm;
    return list.find(function(x){ return x.id === id; });
  }
  function addStep(type, id){
    var inp = root.querySelector('[data-step-input="'+id+'"]');
    var g = goalById(type, id);
    if (!inp || !g) return;
    var text = (inp.value || '').trim();
    if (!text) return;
    if (!g.steps) g.steps = [];
    g.steps.push({ id: uid(), text: text.slice(0, 80), done: false });
    saveGoals();
    render();
    var again = root.querySelector('[data-step-input="'+id+'"]'); if (again) again.focus();
  }
  function deleteStep(type, id, stepId){
    var g = goalById(type, id);
    if (!g || !g.steps) return;
    g.steps = g.steps.filter(function(s){ return s.id !== stepId || s.done; });
    saveGoals(); render();
  }
  function toggleStep(type, id, stepId, el){
    var g = goalById(type, id);
    if (!g || !g.steps) return;
    var s = g.steps.find(function(x){ return x.id === stepId; });
    if (!s) return;
    s.done = !s.done;
    s.doneAt = s.done ? new Date().toISOString() : null;
    addBonusXp(s.done ? STEP_XP : -STEP_XP);
    saveGoals();
    if (s.done){
      xpPop(el, '+'+STEP_XP+' xp');
      var leveled = rememberLevel();
      var landed = g.steps.every(function(x){ return x.done; });
      if (leveled) setTimeout(function(){ celebrateLevel(el); }, 350); else chime(landed ? 'level' : 'up');
      if (landed){ toast('Goal landed: '+g.title); say('gLand', leveled ? [pickLine('level')] : null); }
      else if (leveled) say('level');
    } else {
      chime('down');
    }
    render();
  }

  /* board notes */
  function pinNote(){
    var t = document.getElementById('noteText'), w = document.getElementById('noteWho');
    var text = t ? (t.value || '').trim() : '';
    if (!text){ toast('Write the promise first'); if (t) t.focus(); return; }
    state.notes.push({ id: uid(), text: text.slice(0, 120), who: w ? (w.value || '').trim().slice(0, 40) : '', color: state.noteColor, createdAt: new Date().toISOString(), doneAt: null });
    if (state.boardFilter !== 'all' && state.boardFilter !== state.noteColor) state.boardFilter = 'all';
    saveNotes();
    if (voiceSettings().ticks) say('pin');
    render();
    var again = document.getElementById('noteText'); if (again) again.focus();
  }
  function peelNote(id, el){
    var n = state.notes.find(function(x){ return x.id === id; });
    if (!n) return;
    if (n.doneAt){
      n.doneAt = null;
      addBonusXp(-NOTE_XP);
      chime('down');
    } else {
      n.doneAt = new Date().toISOString();
      addBonusXp(NOTE_XP);
      xpPop(el, '+'+NOTE_XP+' xp');
      var leveled = rememberLevel();
      if (leveled) setTimeout(function(){ celebrateLevel(el); }, 350); else chime('up');
      say('peel', leveled ? [pickLine('level')] : null);
    }
    saveNotes();
    render();
  }
  function deleteNote(id){
    var n = state.notes.find(function(x){ return x.id === id; });
    if (!n) return;
    if (Date.now() - new Date(n.createdAt).getTime() >= 86400000){ toast("Notes lock after 24 hours. Peel it off when it's kept."); return; }
    showConfirm('Delete this note?', 'It is still inside the 24 hour window, so this is allowed.', function(){
      state.notes = state.notes.filter(function(x){ return x.id !== id; });
      saveNotes(); render();
    });
  }
  function deleteTask(id){
    var t = state.day.tasks.find(function(x){return x.id===id;});
    if (!t) return;
    state.day.tasks = state.day.tasks.filter(function(x){return x.id!==id;});
    if (t.goalRef){ adjustGoalStat(t.goalRef, 'planned', -1); if (t.completed) adjustGoalStat(t.goalRef, 'completed', -1); }
    saveDay(); if (t.goalRef) saveGoals();
    syncTodaySummary(); saveSummary();
    render();
  }
  function closeDay(){
    var reflectInput = document.getElementById('reflectInput');
    if (reflectInput) state.day.reflection = reflectInput.value.slice(0,300);
    state.day.closedOut = true;
    state.day.closedAt = new Date().toISOString();
    saveDay();
    syncTodaySummary(); saveSummary();
    render();
    toast('Day closed out.');
    var streak = computeStats().showUpStreak;
    say(closeCat(), [STREAK_LINES[streak] || null]);
  }
  function reopenDay(){
    state.day.closedOut = false;
    state.day.closedAt = null;
    saveDay();
    syncTodaySummary(); saveSummary();
    render();
  }

  /* ---------------- tabs / footer ---------------- */
  document.getElementById('tabs').addEventListener('click', function(e){
    var btn = e.target.closest('.tab');
    if (!btn) return;
    state.activeTab = btn.dataset.tab;
    render();
  });

  function relativeTime(iso){
    if (!iso) return 'never';
    var days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
    if (days <= 0) return 'today';
    if (days === 1) return 'yesterday';
    if (days < 7) return days+' days ago';
    var weeks = Math.floor(days/7);
    if (weeks < 5) return weeks+' week'+(weeks===1?'':'s')+' ago';
    var months = Math.floor(days/30);
    return months+' month'+(months===1?'':'s')+' ago';
  }
  function updateBackupLabel(){
    var el = document.getElementById('backupLabel');
    if (el) el.textContent = '(backup: '+relativeTime(state.meta.lastExportAt)+')';
  }

  function openVoiceSettings(){
    var modalRoot = document.getElementById('modalRoot');
    function draw(){
      var vs = voiceSettings();
      function sw(id, on){ return '<button class="switch'+(on ? ' on' : '')+'" id="'+id+'" role="switch" aria-checked="'+on+'"></button>'; }
      modalRoot.innerHTML =
        '<div class="modal-bg" id="modalBg"><div class="modal" role="dialog" aria-label="Voice coach settings">' +
          '<h3>Voice coach</h3>' +
          '<p>Recorded voices that work offline. The coach speaks when you start the day, finish everything, close out, hit a streak or level up.</p>' +
          '<div class="set-row"><span>Voice coach</span>'+sw('vsOn', vs.on)+'</div>' +
          '<div class="set-row"><span>Voice<small>Tap one to hear it</small></span><div class="seg" role="group" aria-label="Voice">' +
            '<button class="'+(vs.gender !== 'm' ? 'on' : '')+'" data-g="f" aria-pressed="'+(vs.gender !== 'm')+'">Female</button>' +
            '<button class="'+(vs.gender === 'm' ? 'on' : '')+'" data-g="m" aria-pressed="'+(vs.gender === 'm')+'">Male</button></div></div>' +
          '<div class="set-row"><span>Speak on every tick<small>Short lines like “One more kept”</small></span>'+sw('vsTicks', vs.ticks)+'</div>' +
          '<div class="set-row" style="border-bottom:none;"><span>Soft chime on tick</span>'+sw('vsChime', vs.chime)+'</div>' +
          '<div class="row-btns" style="margin-top:14px;"><button class="btn small" id="vsDone">Done</button></div>' +
        '</div></div>';
      function upd(patch){ state.meta.voice = Object.assign({}, voiceSettings(), patch); saveMeta(); draw(); }
      document.getElementById('vsOn').onclick = function(){ upd({ on: !voiceSettings().on }); };
      document.getElementById('vsTicks').onclick = function(){ upd({ ticks: !voiceSettings().ticks }); };
      document.getElementById('vsChime').onclick = function(){ var on = !voiceSettings().chime; upd({ chime: on }); if (on) chime('up'); };
      modalRoot.querySelectorAll('[data-g]').forEach(function(b){
        b.onclick = function(){ var g = b.dataset.g; upd({ gender: g }); preloadVoice(g); playIds(['test1'], { force:true, gender:g }); };
      });
      document.getElementById('vsDone').onclick = function(){ modalRoot.innerHTML = ''; };
      document.getElementById('modalBg').addEventListener('click', function(e){ if (e.target.id === 'modalBg') modalRoot.innerHTML = ''; });
    }
    draw();
  }
  document.getElementById('voiceBtn').onclick = openVoiceSettings;

  document.getElementById('resetBtn').onclick = function(){
    showConfirm('Reset everything?', 'This permanently deletes every goal, countdown, board note, log entry, and logged day. There is no undo.', async function(){
      await deleteAllKeys();
      state = freshState();
      await safeSet('meta:app', state.meta);
      render();
      updateBackupLabel();
      toast('Ledger reset.');
    });
  };

  document.getElementById('exportBtn').onclick = async function(){
    try{
      var stats = computeStats();
      var allLogs = {};
      for (var y in state.logYears){ allLogs[y] = state.logYears[y]; }
      var payload = { exportedAt: new Date().toISOString(), todayDate: state.today, goals: state.goals, events: state.events, days: stats.summary, today: state.day, log: allLogs,
        notes: state.notes, bonusXp: state.meta.bonusXp || 0, voice: voiceSettings() };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'compound-export-'+state.today+'.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      state.meta.lastExportAt = new Date().toISOString();
      await safeSet('meta:app', state.meta);
      updateBackupLabel();
    }catch(e){ toast('Export failed'); }
  };

  document.getElementById('importBtn').onclick = function(){ document.getElementById('importFile').click(); };
  document.getElementById('importFile').addEventListener('change', function(e){
    var file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = async function(){
      try{
        var data = JSON.parse(reader.result);
        if (data.goals){ state.goals = data.goals; await saveGoals(); }
        if (data.events){ state.events = data.events; await saveEvents(); }
        if (Array.isArray(data.days)){
          data.days.forEach(function(entry){ upsertSummary(entry); });
          await saveSummary();
        }
        if (data.today && data.todayDate){
          if (data.todayDate === state.today){
            state.day = data.today;
            if (state.day.tasks) state.day.tasks.forEach(function(t){ if (t.weight==null) t.weight = 2; });
            await saveDay();
          } else {
            await safeSet('day:'+data.todayDate, data.today);
          }
        }
        if (data.log){
          for (var y in data.log){
            var incoming = data.log[y] || [];
            var existing = state.logYears[y] || [];
            var existingIds = {};
            existing.forEach(function(en){ existingIds[en.id] = true; });
            var merged = existing.concat(incoming.filter(function(en){ return !existingIds[en.id]; }));
            state.logYears[y] = merged;
            if (state.logYearsLoaded.indexOf(y) === -1) state.logYearsLoaded.push(y);
            if (state.logYearsAvailable.indexOf(y) === -1) state.logYearsAvailable.push(y);
            await saveLogYear(y);
          }
        }
        if (Array.isArray(data.notes)){
          var haveIds = {};
          state.notes.forEach(function(n){ haveIds[n.id] = true; });
          state.notes = state.notes.concat(data.notes.filter(function(n){ return n && n.id && !haveIds[n.id]; }));
          await saveNotes();
        }
        if (typeof data.bonusXp === 'number' && data.bonusXp > (state.meta.bonusXp || 0)){ state.meta.bonusXp = data.bonusXp; }
        await saveMeta();
        render();
        toast('Import complete.');
      }catch(err){ toast('Import failed, check the file.'); }
    };
    reader.readAsText(file);
  });

  /* ---------------- boot ---------------- */
  (async function boot(){
    await loadAll();
    rememberLevel();
    render();
    updateBackupLabel();
    setTimeout(function(){ preloadVoice(voiceSettings().gender === 'm' ? 'm' : 'f'); }, 600);
  })();

})();
</script>
</body>
</html>
