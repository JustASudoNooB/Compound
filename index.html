<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compound — a daily ledger</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#16201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Compound">
<style>
  :root{
    --bg:#e7e9e1;
    --sheet:#fbfbf8;
    --sheet-2:#f3f2ea;
    --ink:#16201c;
    --ink-soft:#5b6b60;
    --ink-faint:#94a396;
    --rule:#c7cdbe;
    --rule-strong:#a9b39d;
    --teal:#1f5c4d;
    --teal-light:#e4efe9;
    --brick:#9c3b2c;
    --brick-light:#f3e4df;
    --brass:#a9822f;
    --brass-light:#f1e8d2;
    --radius:3px;
    --shadow:0 1px 0 rgba(22,32,28,.06), 0 8px 20px -14px rgba(22,32,28,.35);
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Noto Serif', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
    background:var(--bg);
    background-image:linear-gradient(var(--rule) 1px, transparent 1px);
    background-size:100% 34px;
    background-position:0 148px;
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{ background:var(--brass-light); }
  button{ font-family:inherit; }
  input, textarea, select{ font-family:inherit; font-size:14px; }
  .wrap{ max-width:760px; margin:0 auto; padding:0 20px 80px; }
  header.masthead{ padding:36px 20px 0; max-width:800px; margin:0 auto; }
  .masthead-inner{ display:flex; align-items:flex-end; justify-content:space-between; border-bottom:2px solid var(--ink); padding-bottom:14px; }
  .brand{ font-family:var(--font-display); font-weight:600; font-size:30px; letter-spacing:-0.01em; }
  .brand small{ display:block; font-family:var(--font-mono); font-weight:500; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-top:4px; }
  .streak-badge{ font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); text-align:right; line-height:1.6; }
  .streak-badge b{ color:var(--ink); font-size:18px; display:block; }
  nav.tabs{ max-width:800px; margin:0 auto; display:flex; gap:5px; padding:6px 20px 0; position:relative; top:1px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
  nav.tabs::-webkit-scrollbar{ display:none; }
  .tab{ flex-shrink:0; appearance:none; border:1px solid var(--ink); border-bottom:none; background:var(--sheet-2); color:var(--ink-soft);
    font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    padding:9px 16px 8px; border-radius:4px 4px 0 0; cursor:pointer; transform:translateY(3px);
    transition:transform .12s ease, background .12s ease, color .12s ease; }
  .tab:hover{ color:var(--ink); }
  .tab.active{ background:var(--sheet); color:var(--ink); font-weight:600; transform:translateY(0); }
  .tab .dot{ display:inline-block; width:6px;height:6px; border-radius:50%; margin-right:6px; background:var(--brass); position:relative; top:-1px; }
  main.sheet{ max-width:800px; margin:0 auto; background:var(--sheet); border:1px solid var(--ink); border-radius:0 4px 4px 4px;
    box-shadow:var(--shadow); padding:28px 28px 32px; min-height:420px; }
  h2.section-title{ font-family:var(--font-display); font-weight:600; font-size:20px; margin:0 0 4px; }
  p.section-sub{ color:var(--ink-soft); font-size:13px; margin:0 0 20px; }
  .group-label{ font-size:14px; margin:0; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); }
  .balance{ display:flex; align-items:center; gap:14px; padding:14px 16px; border:1px solid var(--rule-strong); border-radius:var(--radius); background:var(--sheet-2); margin-bottom:22px; flex-wrap:wrap; }
  .balance .count{ font-family:var(--font-mono); font-size:22px; font-weight:600; white-space:nowrap; }
  .balance .count span{ color:var(--ink-soft); font-size:13px; font-weight:500; }
  .balance-track{ flex:1; min-width:80px; height:8px; background:var(--brick-light); border-radius:2px; overflow:hidden; border:1px solid var(--rule-strong); }
  .balance-fill{ height:100%; background:var(--teal); }
  .ledger-rows{ margin-bottom:6px; }
  .row{ display:flex; align-items:flex-start; gap:12px; padding:11px 2px; border-bottom:1px solid var(--rule); }
  .row:first-child{ border-top:1px solid var(--rule); }
  .row-idx{ font-family:var(--font-mono); font-size:12px; color:var(--ink-faint); width:20px; padding-top:3px; flex-shrink:0; }
  .tick{ width:19px;height:19px; border:1.5px solid var(--ink); border-radius:3px; flex-shrink:0; margin-top:1px; cursor:pointer;
    background:var(--sheet); display:flex;align-items:center;justify-content:center; padding:0; }
  .tick svg{ display:none; width:12px;height:12px; }
  .tick.done{ background:var(--teal); border-color:var(--teal); }
  .tick.done svg{ display:block; }
  .row-body{ flex:1; min-width:0; }
  .row-text{ font-size:14.5px; word-break:break-word; }
  .row.done .row-text{ color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--rule-strong); }
  .row-tag{ display:inline-block; margin-top:5px; margin-right:5px; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.04em;
    padding:2px 7px; border-radius:2px; background:var(--brass-light); color:#6b5420; text-transform:uppercase; }
  .row-del{ background:none;border:none;color:var(--ink-faint); cursor:pointer; font-size:16px; padding:2px 4px; flex-shrink:0; line-height:1; }
  .row-del:hover{ color:var(--brick); }
  .add-row{ display:flex; gap:8px; align-items:center; padding:14px 2px 4px; flex-wrap:wrap; }
  input[type="text"], select, input[type="date"], input[type="time"], textarea{ border:1px solid var(--rule-strong); border-radius:var(--radius);
    padding:9px 11px; background:var(--sheet); color:var(--ink); }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--teal); outline-offset:1px; }
  .add-row input[type="text"]{ flex:1; min-width:150px; }
  .add-row select{ max-width:150px; font-size:12.5px; color:var(--ink-soft); }
  .btn{ appearance:none; border:1px solid var(--ink); background:var(--ink); color:var(--sheet); padding:9px 16px;
    border-radius:var(--radius); font-weight:600; font-size:13px; cursor:pointer; }
  .btn:hover{ opacity:.88; }
  .btn.ghost{ background:transparent; color:var(--ink); border-color:var(--rule-strong); }
  .btn.ghost:hover{ border-color:var(--ink); }
  .btn.danger{ background:var(--brick); border-color:var(--brick); }
  .btn.small{ padding:6px 12px; font-size:12px; }
  .close-block{ margin-top:26px; padding-top:18px; border-top:1px dashed var(--rule-strong); }
  textarea.reflect{ width:100%; min-height:56px; resize:vertical; font-size:13.5px; margin-top:10px; }
  .stamp{ display:inline-flex; flex-direction:column; align-items:center; border:2.5px solid var(--stamp-c, var(--teal)); color:var(--stamp-c, var(--teal));
    border-radius:6px; padding:8px 18px; transform:rotate(-4deg); font-family:var(--font-mono); font-weight:600;
    letter-spacing:.06em; font-size:12px; text-transform:uppercase; opacity:.9; }
  .stamp .big{ font-size:16px; letter-spacing:.02em; }
  .empty{ text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13.5px; }
  .empty .big{ font-family:var(--font-display); font-size:19px; color:var(--ink); margin-bottom:6px; font-weight:600; }
  .goal-group{ margin-bottom:30px; }
  .goal-group-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap; }
  .goal-card{ border:1px solid var(--rule-strong); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; background:var(--sheet-2); }
  .goal-card.archived{ opacity:.55; }
  .goal-top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .goal-title{ font-weight:600; font-size:14.5px; }
  .goal-meta{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
  .goal-desc{ font-size:13px; color:var(--ink-soft); margin-top:6px; }
  .goal-progress{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  .goal-track{ flex:1; height:6px; background:var(--brick-light); border-radius:2px; overflow:hidden; border:1px solid var(--rule-strong); }
  .goal-fill{ height:100%; background:var(--teal); }
  .goal-pct{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); white-space:nowrap; }
  .goal-actions{ display:flex; gap:6px; margin-top:10px; }
  .link-btn{ background:none;border:none;color:var(--ink-soft); font-size:11.5px; cursor:pointer; text-decoration:underline; padding:2px 0; display:inline-flex; align-items:center; }
  .link-btn:hover{ color:var(--ink); }
  .inline-form{ border:1px dashed var(--rule-strong); border-radius:var(--radius); padding:14px; margin-bottom:14px; background:var(--sheet); }
  .field-row{ display:flex; gap:10px; margin-bottom:9px; flex-wrap:wrap; }
  .field-row > *{ flex:1; min-width:140px; }
  .field-label{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); display:block; margin-bottom:4px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:14px; }
  .stat-card{ border:1px solid var(--rule-strong); border-radius:var(--radius); padding:12px 14px; background:var(--sheet-2); }
  .stat-card .num{ font-family:var(--font-mono); font-size:22px; font-weight:600; }
  .stat-card .lbl{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
  .heat-wrap{ overflow-x:auto; padding-bottom:6px; margin-bottom:22px; }
  .heat-grid{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(7, 13px); gap:3px; width:max-content; }
  .heat-cell{ width:13px;height:13px; border-radius:1px; border:1px solid rgba(22,32,28,.08); }
  .heat-legend{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-soft); margin-top:8px; }
  .heat-legend .heat-cell{ width:11px;height:11px; }
  table.hist-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.hist-table th{ text-align:left; font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-soft); border-bottom:1px solid var(--ink); padding:6px 8px; }
  table.hist-table td{ padding:8px; border-bottom:1px solid var(--rule); vertical-align:top; }
  table.hist-table tr:last-child td{ border-bottom:none; }
  tr.hist-row{ cursor:pointer; }
  tr.hist-row:hover td{ background:var(--sheet-2); }
  tr.hist-detail-row td{ border-bottom:1px solid var(--rule); }
  .rate-pill{ font-family:var(--font-mono); font-size:11.5px; font-weight:600; padding:2px 7px; border-radius:2px; display:inline-block; }
  .footbar{ max-width:800px; margin:14px auto 0; padding:0 20px; display:flex; justify-content:space-between; align-items:center;
    font-size:12px; color:var(--ink-faint); flex-wrap:wrap; gap:8px; }
  .footbar button{ background:none; border:none; color:var(--ink-faint); text-decoration:underline; cursor:pointer; font-size:12px; }
  .footbar button:hover{ color:var(--ink-soft); }
  #status{ font-family:var(--font-mono); }
  .modal-bg{ position:fixed; inset:0; background:rgba(22,32,28,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal{ background:var(--sheet); border:1px solid var(--ink); border-radius:6px; max-width:380px; width:100%; padding:22px; box-shadow:var(--shadow); }
  .modal h3{ font-family:var(--font-display); margin:0 0 8px; font-size:17px; }
  .modal p{ font-size:13.5px; color:var(--ink-soft); margin:0 0 18px; }
  .modal .row-btns{ display:flex; gap:8px; justify-content:flex-end; }
  .toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--sheet); padding:9px 16px;
    border-radius:5px; font-size:12.5px; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .toast.show{ opacity:1; }
  .log-date-head{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--ink-soft); border-bottom:1px solid var(--ink); padding-bottom:4px; margin-bottom:8px; }
  /* ---------- shared additions ---------- */
  @font-face{ font-family:'Caveat Local'; src:url('./caveat.woff2') format('woff2'); font-weight:600; font-style:normal; font-display:swap; }
  :root{ --font-hand:'Caveat Local', 'Noteworthy', 'Marker Felt', 'Segoe Print', cursive; --brass-ink:#7e6018; }
  .mast-stats{ display:flex; gap:22px; align-items:flex-end; }
  .level-badge{ font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); line-height:1.5; min-width:120px; }
  .level-badge b{ color:var(--ink); font-size:18px; display:block; line-height:1.3; }
  .lvl-track{ height:5px; background:var(--sheet); border:1px solid var(--rule-strong); border-radius:2px; overflow:hidden; margin:3px 0 2px; }
  .lvl-fill{ height:100%; background:var(--brass); transition:width .4s ease; }
  .tick{ position:relative; }
  .tick::after{ content:''; position:absolute; inset:-12px; }
  .xp-chip{ flex-shrink:0; font-family:var(--font-mono); font-size:10.5px; font-weight:600; padding:2px 6px; border-radius:2px; background:var(--sheet-2); color:var(--ink-soft); border:1px solid var(--rule); margin-top:1px; white-space:nowrap; }
  .row.done .xp-chip{ background:var(--teal-light); color:var(--teal); border-color:#bcd6cb; }
  .xp-today{ font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--brass-ink); white-space:nowrap; }
  .xp-pop{ position:fixed; z-index:70; pointer-events:none; font-family:var(--font-mono); font-weight:700; font-size:12.5px; color:#fff; background:var(--teal); padding:3px 8px; border-radius:3px; transform:translate(-50%,0); animation:xpPop .95s ease-out forwards; white-space:nowrap; }
  .xp-pop.lvl{ background:var(--brass-ink); }
  @keyframes xpPop{ 0%{opacity:0; transform:translate(-50%,8px) scale(.9);} 20%{opacity:1; transform:translate(-50%,0) scale(1.05);} 100%{opacity:0; transform:translate(-50%,-34px) scale(1);} }
  .balance .coach-btn{ margin-left:auto; }
  .coach-btn{ display:inline-flex; align-items:center; gap:5px; min-height:32px; padding:0 10px; border:1px solid var(--rule-strong); border-radius:999px; background:var(--sheet); color:var(--ink); font-size:12px; font-weight:600; cursor:pointer; }
  .coach-btn:hover{ border-color:var(--ink); }
  .status{ justify-self:start; display:inline-block; font-family:var(--font-mono); font-size:10.5px; font-weight:700; letter-spacing:.06em; padding:2px 6px; border:1px solid currentColor; border-radius:2px; white-space:nowrap; line-height:1.4; }
  .blink{ animation:blink 1.2s steps(1) infinite; }
  @keyframes blink{ 0%,55%{opacity:1} 56%,100%{opacity:.3} }

  /* departures board */
  .dep{ background:var(--ink); color:#f2ebd9; border-radius:6px; padding:16px 14px 6px; margin-bottom:26px; box-shadow:0 14px 26px -20px rgba(22,32,28,.9); }
  .dep-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .dep-h{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.2em; color:#e0b04a; }
  .dep-clock{ font-family:var(--font-mono); font-size:12px; color:#a9b4ad; }
  .dep-next{ font-family:var(--font-display); font-size:19px; font-weight:600; margin:6px 0 10px; line-height:1.2; }
  .flaps{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .flap-grp{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .flap-digits{ display:flex; gap:3px; }
  .flap{ width:25px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:3px; background:linear-gradient(#2a362f 0 50%, #212b25 50% 100%); box-shadow:inset 0 0 0 1px rgba(0,0,0,.45); color:#f0b43c; font-family:var(--font-mono); font-weight:700; font-size:21px; }
  .flap-lbl{ font-family:var(--font-mono); font-size:9px; letter-spacing:.16em; color:#94a396; }
  .dep-row{ width:100%; min-height:52px; padding:8px 2px; border:none; border-top:1px solid #2f3c35; background:transparent; color:inherit; text-align:left; cursor:pointer; font-family:inherit;
    display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:12px; row-gap:2px; align-items:center; }
  .dep-row .nm{ grid-column:1; grid-row:1; font-size:13.5px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dep-row .sub{ grid-column:1; grid-row:2; font-family:var(--font-mono); font-size:11px; color:#a9b4ad; }
  .dep-row .tm{ font-weight:700; color:#f0b43c; }
  .dep-row .status{ grid-column:2; grid-row:1 / span 2; justify-self:end; }
  .dep-empty{ font-size:13px; color:#a9b4ad; padding:4px 2px 12px; }
  .dep-foot{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 2px 6px; border-top:1px solid #2f3c35; }
  .dep-foot .coach-btn{ background:transparent; color:#f2ebd9; border-color:#4a5a51; }

  /* goal cards: status, work vs time, steps */
  .wt{ margin-top:10px; }
  .wt-labels{ display:flex; justify-content:space-between; gap:8px; font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); margin-bottom:4px; }
  .wt-track{ position:relative; height:8px; background:var(--sheet); border:1px solid var(--rule-strong); border-radius:2px; }
  .wt-fill{ position:absolute; left:0; top:0; bottom:0; border-radius:1px; transition:width .35s ease; }
  .wt-mark{ position:absolute; top:-4px; bottom:-4px; width:2px; margin-left:-1px; background:var(--ink); }
  .steps{ margin-top:12px; border-top:1px dashed var(--rule-strong); padding-top:4px; }
  .step-line{ display:flex; align-items:center; gap:4px; }
  .step{ flex:1; min-width:0; display:flex; align-items:center; gap:10px; min-height:40px; border:none; background:transparent; text-align:left; cursor:pointer; padding:2px 0; color:var(--ink); font-size:13.5px; }
  .step .bx{ width:18px; height:18px; border:1.5px solid var(--ink); border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--sheet); }
  .step .bx svg{ display:none; }
  .step.done .bx{ background:var(--teal); border-color:var(--teal); }
  .step.done .bx svg{ display:block; }
  .step.done .lbl{ color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--rule-strong); }
  .step-add{ display:flex; gap:6px; margin-top:6px; }
  .step-add input[type="text"]{ flex:1; min-width:0; padding:7px 9px; font-size:13px; }

  /* board */
  .composer{ border:1px dashed var(--rule-strong); border-radius:var(--radius); padding:12px; margin-bottom:16px; background:var(--sheet); display:flex; flex-direction:column; gap:8px; }
  .composer input[type="text"]{ width:100%; }
  .composer-bottom{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .swatches{ display:flex; }
  .swatch{ width:40px; height:40px; border:none; background:transparent; padding:0; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
  .swatch span{ width:24px; height:24px; border-radius:50%; display:block; border:1px solid rgba(0,0,0,.12); }
  .swatch.on span{ box-shadow:0 0 0 2px var(--sheet), 0 0 0 4px var(--ink); }
  .chip-row{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{ flex-shrink:0; display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border:1px solid var(--rule-strong); border-radius:999px; background:var(--sheet); color:var(--ink-soft); font-size:12.5px; font-weight:600; cursor:pointer; }
  .chip.on{ background:var(--ink); color:var(--sheet); border-color:var(--ink); }
  .chip .sw{ width:10px; height:10px; border-radius:50%; }
  .board{ background-color:#1f2a25; background-image:radial-gradient(rgba(255,255,255,.08) 1px, transparent 1.3px); background-size:14px 14px; border-radius:6px; padding:24px 14px 20px; display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:26px 12px; }

  @media (max-width:600px){

  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

<script>
  /* ---------------- on-device storage shim ----------------
     Same get/set/delete/list contract as the Claude-artifact
     storage API, backed by localStorage instead of a network
     call, so the rest of the app is untouched. Everything
     lives under a 'compound:' key prefix in this origin's
     local storage, which is what makes it work offline. */
  window.storage = (function(){
    var NS = 'compound:';
    function full(key){ return NS + key; }
    return {
      get: function(key){
        return new Promise(function(resolve, reject){
          try{
            var raw = window.localStorage.getItem(full(key));
            if (raw === null){ reject(new Error('not found')); return; }
            resolve({ key: key, value: raw, shared: false });
          }catch(e){ reject(e); }
        });
      },
      set: function(key, value){
        return new Promise(function(resolve){
          try{
            window.localStorage.setItem(full(key), value);
            resolve({ key: key, value: value, shared: false });
          }catch(e){ resolve(null); }
        });
      },
      delete: function(key){
        return new Promise(function(resolve){
          try{
            var existed = window.localStorage.getItem(full(key)) !== null;
            window.localStorage.removeItem(full(key));
            resolve({ key: key, deleted: existed, shared: false });
          }catch(e){ resolve(null); }
        });
      },
      list: function(prefix){
        return new Promise(function(resolve){
          var keys = [];
          try{
            for (var i=0;i<window.localStorage.length;i++){
              var k = window.localStorage.key(i);
              if (k.indexOf(NS) === 0){
                var real = k.slice(NS.length);
                if (!prefix || real.indexOf(prefix) === 0) keys.push(real);
              }
            }
          }catch(e){}
          resolve({ keys: keys, prefix: prefix, shared: false });
        });
      }
    };
  })();

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./service-worker.js').then(function(reg){ if (reg && reg.update) reg.update(); }).catch(function(){});
      var reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){ if (reloaded) return; reloaded = true; window.location.reload(); });
    });
  }

(function(){
  "use strict";

  /* ---------------- utilities ---------------- */
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function pad(n){ return String(n).padStart(2,'0'); }
  function toDateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function todayStr(){ return toDateStr(new Date()); }
  function addDays(dateStr, n){
    var d = new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()+n);
    return toDateStr(d);
  }
  function prettyDate(dateStr){
    var d = new Date(dateStr+'T00:00:00');
    return d.toLocaleDateString(undefined,{ weekday:'short', month:'short', day:'numeric' });
  }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function pct(part, whole){ return whole > 0 ? Math.round((part/whole)*100) : 0; }
  function speakerIcon(){
    return '<svg viewBox="0 0 20 20" width="13" height="13" style="vertical-align:-2px;margin-right:4px;" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 7.5h2.6L9 4.8v10.4L5.6 12.5H3z" fill="currentColor" stroke="none"/><path d="M12.3 6.8a4 4 0 010 6.4" stroke-linecap="round"/></svg>';
  }
  function lockIcon(){
    return '<svg viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" style="vertical-align:-2px;"><rect x="4" y="9" width="12" height="8" rx="1.5"/><path d="M6.5 9V6.5a3.5 3.5 0 017 0V9"/></svg>';
  }

  /* ---------------- countdown math ---------------- */
  function daysInMonthBefore(y, m){ return new Date(y, m, 0).getDate(); }
  function diffYMD(a, b){
    var y = b.getFullYear()-a.getFullYear();
    var m = b.getMonth()-a.getMonth();
    var d = b.getDate()-a.getDate();
    if (d<0){ m-=1; d += daysInMonthBefore(b.getFullYear(), b.getMonth()); }
    if (m<0){ y-=1; m+=12; }
    return { years:y, months:m, days:d };
  }
  function formatCountdown(targetDate, targetTime){
    var target = new Date(targetDate+'T'+(targetTime||'00:00')+':00');
    var now = new Date();
    var passed = target < now;
    var a = passed ? target : now;
    var b = passed ? now : target;
    var diff = diffYMD(a,b);
    var text;
    if (diff.years>0) text = diff.years+(diff.years===1?' year':' years')+', '+diff.months+(diff.months===1?' month':' months');
    else if (diff.months>0) text = diff.months+(diff.months===1?' month':' months')+', '+diff.days+(diff.days===1?' day':' days');
    else text = diff.days===0 ? 'today' : (diff.days+(diff.days===1?' day':' days'));
    return { text:text, passed:passed };
  }
  function daysUntil(targetDate, targetTime){
    var target = new Date(targetDate+'T'+(targetTime||'00:00')+':00').getTime();
    return (target - Date.now()) / 86400000;
  }
  function deadlineColor(daysLeft, passed){
    if (passed || daysLeft <= 7) return 'var(--brick)';
    if (daysLeft <= 30) return 'var(--brass)';
    return 'var(--teal)';
  }
  function elapsedFraction(createdAt, targetDate, targetTime){
    var start = new Date(createdAt+'T00:00:00').getTime();
    var end = new Date(targetDate+'T'+(targetTime||'00:00')+':00').getTime();
    if (end <= start) return 1;
    var f = (Date.now() - start) / (end - start);
    return Math.max(0, Math.min(1, f));
  }

  /* ---------------- storage ---------------- */
  async function safeGet(key, fallback){
    try{
      var res = await window.storage.get(key, false);
      if(!res || res.value == null) return fallback;
      return JSON.parse(res.value);
    }catch(e){ return fallback; }
  }
  async function safeSet(key, value){
    try{
      setStatus('saving…');
      var res = await window.storage.set(key, JSON.stringify(value), false);
      setStatus(res ? 'saved' : 'save failed');
      if(res) setTimeout(function(){ if(statusEl.textContent==='saved') setStatus(''); }, 1200);
      return !!res;
    }catch(e){ setStatus('save failed'); return false; }
  }
  async function deleteAllKeys(){
    try{
      var days = await window.storage.list('day:', false);
      var logs = await window.storage.list('log:', false);
      var keys = ['meta:goals','meta:app','stats:daily-summary','meta:events','meta:notes'];
      if(days && days.keys) keys = keys.concat(days.keys);
      if(logs && logs.keys) keys = keys.concat(logs.keys);
      for (var i=0;i<keys.length;i++){
        try{ await window.storage.delete(keys[i], false); }catch(e){}
      }
    }catch(e){}
  }

  var statusEl = document.getElementById('status');
  function setStatus(t){ statusEl.textContent = t; }
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  /* ---------------- voice coach (recorded clips, works offline) ---------------- */
  var LINES = {
    start:['start1','start2','start3'], plan:['plan1','plan2'], prog:['prog1','prog2','prog3'], near:['near1','near2'],
    done:['done1','done2'], tick:['tick1','tick2','tick3'], big:['big1','big2'],
    closeP:['closeP'], closeG:['closeG'], closeL:['closeL'], closeZ:['closeZ'], closeE:['closeE'],
    level:['level1','level2'], gFinal:['gFinal'], gDelay:['gDelay'], gOn:['gOn'], gLand:['gLand'],
    peel:['peel1','peel2'], pin:['pin1'], grUp:['grUp'], grDown:['grDown'], grFlat:['grFlat'],
    logSaved:['logSaved'], test:['test1']
  };
  var STREAK_LINES = { 3:'s3', 7:'s7', 14:'s14', 21:'s21', 30:'s30', 50:'s50', 100:'s100' };
  function allVoiceIds(){
    var ids = [];
    Object.keys(LINES).forEach(function(k){ ids = ids.concat(LINES[k]); });
    Object.keys(STREAK_LINES).forEach(function(k){ ids.push(STREAK_LINES[k]); });
    return ids;
  }
  function defaultVoice(){ return { on:true, gender:'f', ticks:false, chime:true }; }
  function voiceSettings(){ return state.meta.voice || defaultVoice(); }
  var lastPick = {};
  function pickLine(cat){
    var arr = LINES[cat];
    if (!arr || !arr.length) return null;
    if (arr.length === 1) return arr[0];
    var pick = arr[Math.floor(Math.random()*arr.length)];
    if (pick === lastPick[cat]) pick = arr[(arr.indexOf(pick)+1) % arr.length];
    lastPick[cat] = pick;
    return pick;
  }
  var voiceBlobs = {};
  function preloadVoice(g){
    if (!window.fetch || !window.URL || !URL.createObjectURL) return;
    allVoiceIds().forEach(function(id){
      var key = g+'/'+id;
      if (voiceBlobs[key]) return;
      fetch('./voice/'+key+'.mp3').then(function(r){ return r.ok ? r.blob() : null; })
        .then(function(b){ if (b && b.size) voiceBlobs[key] = URL.createObjectURL(b); }).catch(function(){});
    });
  }
  function voiceSrc(g, id){ return voiceBlobs[g+'/'+id] || ('./voice/'+g+'/'+id+'.mp3'); }
  var voiceAudio = null, voiceQueue = [];
  function playIds(ids, opts){
    opts = opts || {};
    var vs = voiceSettings();
    if (!opts.force && !vs.on) return;
    ids = (ids || []).filter(Boolean);
    if (!ids.length) return;
    var g = (opts.gender || vs.gender) === 'm' ? 'm' : 'f';
    try{
      if (!voiceAudio){
        voiceAudio = new Audio();
        voiceAudio.preload = 'auto';
        voiceAudio.addEventListener('ended', function(){
          var next = voiceQueue.shift();
          if (next){ voiceAudio.src = next; var p2 = voiceAudio.play(); if (p2 && p2.catch) p2.catch(function(){}); }
        });
      }
      voiceAudio.pause();
      var srcs = ids.map(function(id){ return voiceSrc(g, id); });
      voiceQueue = srcs.slice(1);
      voiceAudio.src = srcs[0];
      var p = voiceAudio.play();
      if (p && p.catch) p.catch(function(){});
    }catch(e){}
  }
  function say(cat, extraIds){ playIds([pickLine(cat)].concat(extraIds || [])); }

  var audioCtx = null;
  function chime(kind){
    if (!voiceSettings().chime) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var notes = kind === 'level' ? [523.25, 659.25, 783.99, 1046.5] : kind === 'down' ? [392] : [659.25, 987.77];
      var t0 = audioCtx.currentTime + 0.01;
      notes.forEach(function(f, i){
        var o = audioCtx.createOscillator(), gn = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        var st = t0 + i*0.085;
        gn.gain.setValueAtTime(0.0001, st);
        gn.gain.exponentialRampToValueAtTime(0.16, st + 0.015);
        gn.gain.exponentialRampToValueAtTime(0.0001, st + 0.5);
        o.connect(gn); gn.connect(audioCtx.destination);
        o.start(st); o.stop(st + 0.55);
      });
    }catch(e){}
  }

  /* ---------------- XP and levels ---------------- */
  var XP_BY_WEIGHT = { 1:10, 2:20, 3:40 };
  var STEP_XP = 15, NOTE_XP = 15;
  function taskXp(t){ return XP_BY_WEIGHT[t.weight || 2] || 20; }
  function entryXp(e){ return e.completedXp != null ? e.completedXp : (e.completedWeight || 0) * 10; }
  function levelInfo(xp){
    var level = 1, need = 150, rem = Math.max(0, xp);
    while (rem >= need){ rem -= need; level++; need = 100 + 50*level; }
    return { level:level, into:rem, need:need, pct: Math.round(rem/need*100) };
  }
  function xpPop(el, text, isLevel){
    if (!el || !el.getBoundingClientRect) return;
    var r = el.getBoundingClientRect();
    var s = document.createElement('span');
    s.className = 'xp-pop' + (isLevel ? ' lvl' : '');
    s.textContent = text;
    s.style.left = (r.left + r.width/2) + 'px';
    s.style.top = Math.max(8, r.top - 26) + 'px';
    document.body.appendChild(s);
    setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 1000);
  }
  function rememberLevel(){
    var lvl = levelInfo(computeStats().xp).level;
    if (lvl > (state.meta.maxLevel || 0)){
      var first = !state.meta.maxLevel;
      state.meta.maxLevel = lvl;
      safeSet('meta:app', state.meta);
      return !first;
    }
    return false;
  }
  function addBonusXp(n){
    state.meta.bonusXp = Math.max(0, (state.meta.bonusXp || 0) + n);
    safeSet('meta:app', state.meta);
  }

  /* ---------------- state ---------------- */
  var state = {
    activeTab: 'today',
    goals: { longTerm: [], shortTerm: [] },
    events: [],
    summary: [],
    meta: { lastActiveDate: null, lastExportAt: null, voice: defaultVoice(), bonusXp: 0, maxLevel: 0 },
    today: todayStr(),
    day: { tasks: [], reflection: '', closedOut: false, closedAt: null },
    notes: [],
    logYears: {},
    logYearsAvailable: [],
    logYearsLoaded: [],
    editingLogId: null,
    expandedHistoryDate: null,
    historyDayCache: {},
    historyRowLimit: 16,
    boardFilter: 'all',
    noteColor: 'orange',
    growthRange: 30
  };
  function freshState(){
    return { activeTab:'today', goals:{longTerm:[],shortTerm:[]}, events:[], summary:[],
      meta:{ lastActiveDate:null, lastExportAt:null, voice: defaultVoice(), bonusXp:0, maxLevel:0 },
      today: todayStr(), day:{tasks:[],reflection:'',closedOut:false,closedAt:null}, notes:[],
      logYears:{}, logYearsAvailable:[], logYearsLoaded:[], editingLogId:null,
      expandedHistoryDate:null, historyDayCache:{}, historyRowLimit:16,
      boardFilter:'all', noteColor:'orange', growthRange:30 };
  }

  function summaryIndex(date){
    for (var i=0;i<state.summary.length;i++){ if(state.summary[i].date===date) return i; }
    return -1;
  }
  function upsertSummary(entry){
    var idx = summaryIndex(entry.date);
    if(idx>=0) state.summary[idx] = entry; else state.summary.push(entry);
    state.summary.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  }
  function findGoal(ref){
    if(!ref || !ref.id) return null;
    var list = ref.type==='long' ? state.goals.longTerm : state.goals.shortTerm;
    for (var i=0;i<list.length;i++){ if(list[i].id===ref.id) return list[i]; }
    return null;
  }
  function adjustGoalStat(ref, field, delta){
    var g = findGoal(ref);
    if(!g) return;
    if(!g.stats) g.stats = { planned:0, completed:0 };
    g.stats[field] = Math.max(0, (g.stats[field]||0) + delta);
  }

  /* ---------------- load / backfill ---------------- */
  async function loadAll(){
    state.goals = await safeGet('meta:goals', { longTerm:[], shortTerm:[] });
    state.events = await safeGet('meta:events', []);
    state.summary = await safeGet('stats:daily-summary', []);
    state.meta = await safeGet('meta:app', { lastActiveDate: null });
    if (state.meta.lastExportAt === undefined) state.meta.lastExportAt = null;
    if (!state.meta.voice){
      state.meta.voice = defaultVoice();
      if (state.meta.voiceOnClose === false) state.meta.voice.on = false;
    }
    delete state.meta.voiceOnClose;
    if (state.meta.bonusXp == null) state.meta.bonusXp = 0;
    state.notes = await safeGet('meta:notes', []);
    state.goals.longTerm = state.goals.longTerm || [];
    state.goals.shortTerm = state.goals.shortTerm || [];
    state.today = todayStr();
    state.day = await safeGet('day:'+state.today, { tasks:[], reflection:'', closedOut:false, closedAt:null });
    state.day.tasks.forEach(function(t){ if(t.weight==null) t.weight = 2; });
    await backfill();
    await discoverLogYears();
    await loadLogYear(new Date().getFullYear());
  }

  async function backfill(){
    var last = state.meta.lastActiveDate;
    var today = state.today;
    if(!last){ state.meta.lastActiveDate = today; await safeSet('meta:app', state.meta); return; }
    if(last === today) return;

    if (summaryIndex(last) === -1){
      var lastRec = await safeGet('day:'+last, null);
      if (lastRec){
        var planned = lastRec.tasks.length;
        var completed = lastRec.tasks.filter(function(t){return t.completed;}).length;
        var pw = lastRec.tasks.reduce(function(s,t){return s+(t.weight||2);},0);
        var cw = lastRec.tasks.filter(function(t){return t.completed;}).reduce(function(s,t){return s+(t.weight||2);},0);
        var cx = lastRec.tasks.filter(function(t){return t.completed;}).reduce(function(s,t){return s+taskXp(t);},0);
        upsertSummary({ date:last, planned:planned, completed:completed, plannedWeight:pw, completedWeight:cw, completedXp:cx,
          rate: planned? completed/planned : 0, closedOut: !!lastRec.closedOut });
      } else {
        upsertSummary({ date:last, planned:0, completed:0, plannedWeight:0, completedWeight:0, rate:0, closedOut:false });
      }
    }
    var d = addDays(last, 1);
    while (d < today){
      if (summaryIndex(d) === -1){
        upsertSummary({ date:d, planned:0, completed:0, plannedWeight:0, completedWeight:0, rate:0, closedOut:false });
      }
      d = addDays(d, 1);
    }
    state.meta.lastActiveDate = today;
    await safeSet('stats:daily-summary', state.summary);
    await safeSet('meta:app', state.meta);
  }

  function saveGoals(){ return safeSet('meta:goals', state.goals); }
  function saveEvents(){ return safeSet('meta:events', state.events); }
  function saveDay(){ return safeSet('day:'+state.today, state.day); }
  function saveSummary(){ return safeSet('stats:daily-summary', state.summary); }
  function saveNotes(){ return safeSet('meta:notes', state.notes); }
  function saveMeta(){ return safeSet('meta:app', state.meta); }

  async function discoverLogYears(){
    try{
      var res = await window.storage.list('log:', false);
      var keys = (res && res.keys) ? res.keys : [];
      state.logYearsAvailable = keys.map(function(k){ return k.split(':')[1]; }).filter(Boolean).sort().reverse();
    }catch(e){ state.logYearsAvailable = []; }
  }
  async function loadLogYear(year){
    var y = String(year);
    if (state.logYearsLoaded.indexOf(y) >= 0) return;
    var entries = await safeGet('log:'+y, []);
    state.logYears[y] = entries;
    state.logYearsLoaded.push(y);
    if (state.logYearsAvailable.indexOf(y) === -1) state.logYearsAvailable.push(y);
    state.logYearsAvailable.sort().reverse();
  }
  function saveLogYear(year){ return safeSet('log:'+year, state.logYears[String(year)] || []); }

  function syncTodaySummary(){
    var planned = state.day.tasks.length;
    var completed = state.day.tasks.filter(function(t){return t.completed;}).length;
    var plannedWeight = state.day.tasks.reduce(function(s,t){return s+(t.weight||2);},0);
    var completedWeight = state.day.tasks.filter(function(t){return t.completed;}).reduce(function(s,t){return s+(t.weight||2);},0);
    var completedXp = state.day.tasks.filter(function(t){return t.completed;}).reduce(function(s,t){return s+taskXp(t);},0);
    upsertSummary({
      date: state.today, planned: planned, completed: completed,
      plannedWeight: plannedWeight, completedWeight: completedWeight, completedXp: completedXp,
      rate: planned ? completed/planned : 0, closedOut: state.day.closedOut
    });
  }

  /* ---------------- streaks / stats ---------------- */
  function computeStats(){
    var summary = state.summary.slice();
    var idx = -1;
    for (var i=0;i<summary.length;i++){ if(summary[i].date===state.today) idx=i; }
    var todayPlanned = state.day.tasks.length;
    var todayCompleted = state.day.tasks.filter(function(t){return t.completed;}).length;
    var todayPW = state.day.tasks.reduce(function(s,t){return s+(t.weight||2);},0);
    var todayCW = state.day.tasks.filter(function(t){return t.completed;}).reduce(function(s,t){return s+(t.weight||2);},0);
    var todayCX = state.day.tasks.filter(function(t){return t.completed;}).reduce(function(s,t){return s+taskXp(t);},0);
    var todayEntry = { date: state.today, planned: todayPlanned, completed: todayCompleted,
      plannedWeight: todayPW, completedWeight: todayCW, completedXp: todayCX,
      rate: todayPlanned? todayCompleted/todayPlanned:0, closedOut: state.day.closedOut };
    if(idx>=0) summary[idx] = todayEntry; else summary.push(todayEntry);
    summary.sort(function(a,b){ return a.date < b.date ? -1:1; });

    var showUp=0, showUpBest=0, perfect=0, perfectBest=0;
    var totalPlanned=0, totalCompleted=0, totalPW=0, totalCW=0, daysLogged=0, taskXpTotal=0;
    for (var j=0;j<summary.length;j++){
      var e = summary[j];
      taskXpTotal += entryXp(e);
      totalPlanned += e.planned; totalCompleted += e.completed;
      totalPW += (e.plannedWeight||0); totalCW += (e.completedWeight||0);
      if(e.planned>0 || e.closedOut) daysLogged++;
      if(e.closedOut){ showUp++; showUpBest=Math.max(showUpBest, showUp); } else { showUp=0; }
      if(e.planned>0 && e.completed>=e.planned){ perfect++; perfectBest=Math.max(perfectBest, perfect); } else { perfect=0; }
    }
    return {
      summary: summary,
      showUpStreak: showUp, showUpBest: showUpBest,
      perfectStreak: perfect, perfectBest: perfectBest,
      lifetimeRate: totalPlanned? Math.round((totalCompleted/totalPlanned)*100) : 0,
      weightedRate: totalPW? Math.round((totalCW/totalPW)*100) : 0,
      totalPlanned: totalPlanned, totalCompleted: totalCompleted, daysLogged: daysLogged,
      xp: taskXpTotal + (state.meta.bonusXp || 0), xpToday: todayCX
    };
  }

  /* ---------------- rendering: shell ---------------- */
  var root = document.getElementById('viewRoot');
  var streakBadge = document.getElementById('streakBadge');
  var levelBadge = document.getElementById('levelBadge');
  var depTimer = null;

  function render(){
    document.querySelectorAll('.tab').forEach(function(t){
      var on = t.dataset.tab === state.activeTab;
      t.classList.toggle('active', on);
      var dot = t.querySelector('.dot');
      if (on && !dot){ t.insertAdjacentHTML('afterbegin', '<span class="dot"></span>'); }
      if (!on && dot){ dot.parentNode.removeChild(dot); }
    });
    var stats = computeStats();
    streakBadge.innerHTML = '<b>'+stats.showUpStreak+' day'+(stats.showUpStreak===1?'':'s')+'</b>current streak';
    var L = levelInfo(stats.xp);
    levelBadge.innerHTML = '<b>Level '+L.level+'</b><div class="lvl-track"><div class="lvl-fill" style="width:'+L.pct+'%"></div></div>'+L.into+' / '+L.need+' xp';
    if (depTimer){ clearInterval(depTimer); depTimer = null; }
    if (state.activeTab === 'today') root.innerHTML = renderToday();
    else if (state.activeTab === 'board') root.innerHTML = renderBoard();
    else if (state.activeTab === 'goals') root.innerHTML = renderGoals();
    else if (state.activeTab === 'growth') root.innerHTML = renderGrowth(stats);
    else if (state.activeTab === 'log') root.innerHTML = renderLog();
    else root.innerHTML = renderHistory(stats);
    bindDynamic();
    if (state.activeTab === 'goals' && document.getElementById('flap-0')){
      depTimer = setInterval(tickDepartures, 1000);
    }
  }

  /* ---------------- Today ---------------- */
  function goalOptionsHtml(selectedRef){
    var out = '<option value="">— no goal linked —</option>';
    state.goals.longTerm.filter(function(g){return !g.archived;}).forEach(function(g){
      var sel = selectedRef && selectedRef.type==='long' && selectedRef.id===g.id ? ' selected' : '';
      out += '<option value="long:'+g.id+'"'+sel+'>◆ '+escapeHtml(g.title)+'</option>';
    });
    state.goals.shortTerm.filter(function(g){return !g.archived;}).forEach(function(g){
      var sel = selectedRef && selectedRef.type==='short' && selectedRef.id===g.id ? ' selected' : '';
      out += '<option value="short:'+g.id+'"'+sel+'>· '+escapeHtml(g.title)+'</option>';
    });

  }

    var addRow = state.day.closedOut ? '' : (

        '<select id="newTaskWeight" title="how big a promise is this">' +

          '<option value="2" selected>Standard · 20 xp</option>' +

    );

    var closeBlock;

      var stampColor = rate>=100 ? 'var(--teal)' : (rate>=50 ? 'var(--brass)' : 'var(--brick)');
      closeBlock = '<div class="close-block" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;">' +
        '<div class="stamp" style="--stamp-c:'+stampColor+'">CLOSED<span class="big">'+completed+' / '+planned+' KEPT</span></div>' +
        '<button class="btn ghost small" data-action="reopen">Reopen today</button>' +
      '</div>';
      if (state.day.reflection){
        closeBlock += '<p class="section-sub" style="margin-top:14px;">Note: '+escapeHtml(state.day.reflection)+'</p>';
      }
    } else {
      closeBlock = '<div class="close-block">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">' +
          '<div class="section-sub" style="margin:0;">Close out the day to lock today&#39;s entries into the ledger.</div>' +
          '<button class="btn" data-action="close-day">Close out today</button>' +

      '</div>';
    var xpToday = tasks.filter(function(t){return t.completed;}).reduce(function(s,t){return s+taskXp(t);},0);

    return '' +
      '<h2 class="section-title">'+prettyDate(state.today)+'</h2>' +

      '<div class="balance">' +
        '<div class="count">'+completed+'<span> / '+planned+' kept</span></div>' +
        '<div class="balance-track"><div class="balance-fill" style="width:'+rate+'%"></div></div>' +
        '<div class="xp-today">+'+xpToday+(xpPossible ? ' / '+xpPossible : '')+' xp</div>' +

  /* ---------------- Goals + Countdowns ---------------- */
  function goalProgress(g, type){
    var planned = (g.stats && g.stats.planned) || 0;
    var completed = (g.stats && g.stats.completed) || 0;
    if (type==='long'){
      state.goals.shortTerm.forEach(function(s){
        if (s.parentGoalId === g.id){
          planned += (s.stats && s.stats.planned) || 0;
          completed += (s.stats && s.stats.completed) || 0;
        }
      });
    }
    return { planned:planned, completed:completed, pct: pct(completed, planned) };
  }

  var CHECK_SVG = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none"><path d="M3 8.5L6.5 12L13 4.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var STATUS_DARK = { landed:'#5fd39a', ontime:'#5fd39a', delayed:'#f0b43c', final:'#ff7a6b', missed:'#ff7a6b', nodate:'#94a396', soon:'#f0b43c', sched:'#a9b4ad', passed:'#94a396' };
  var STATUS_LIGHT = { landed:'#1f5c4d', ontime:'#1f5c4d', delayed:'#7e6018', final:'#9c3b2c', missed:'#9c3b2c', nodate:'#5b6b60' };

  function goalWork(g, type){
    if (g.steps && g.steps.length){
      var d = g.steps.filter(function(s){ return s.done; }).length;
      return { frac: d/g.steps.length, label: d+'/'+g.steps.length+' steps', has:true };
    }
    var p = goalProgress(g, type);
    return { frac: p.planned ? p.completed/p.planned : 0, label: p.completed+'/'+p.planned+' tasks', has: p.planned > 0 };
  }
  function goalStatus(g, type){
    var w = goalWork(g, type);
    var out = { work: w.frac, workLabel: w.label, time: null };
    if (w.has && w.frac >= 1){ out.key = 'landed'; out.label = 'LANDED'; return out; }
    if (!g.targetDate){ out.key = 'nodate'; out.label = 'NO DATE'; return out; }
    var end = new Date(g.targetDate+'T23:59:59').getTime();
    var start = new Date((g.createdAt || g.targetDate)+'T00:00:00').getTime();
    var now = Date.now();
    out.time = end > start ? Math.max(0, Math.min(1, (now-start)/(end-start))) : 1;
    if (now > end){ out.key = 'missed'; out.label = 'MISSED'; }
    else if ((end-now)/86400000 < 7){ out.key = 'final'; out.label = 'FINAL CALL'; }
    else if (w.frac + 0.1 < out.time){ out.key = 'delayed'; out.label = 'DELAYED'; }
    else { out.key = 'ontime'; out.label = 'ON TIME'; }
    return out;
  }

  function departureItems(){
    var items = [];
    var now = Date.now();
    function addGoal(g, type){
      if (g.archived || !g.targetDate) return;
      items.push({ kind:'goal', id:g.id, title:g.title, date:g.targetDate, end:new Date(g.targetDate+'T23:59:59').getTime(), st:goalStatus(g, type) });
    }
    state.goals.longTerm.forEach(function(g){ addGoal(g, 'long'); });
    state.goals.shortTerm.forEach(function(g){ addGoal(g, 'short'); });
    state.events.forEach(function(ev){
      var end = new Date(ev.targetDate+'T'+(ev.targetTime||'00:00')+':00').getTime();
      if (end < now - 86400000) return;
      var days = (end - now)/86400000;
      var st = end < now ? { key:'passed', label:'PASSED' } : days < 7 ? { key:'soon', label:'SOON' } : { key:'sched', label:'SCHEDULED' };
      items.push({ kind:'event', id:ev.id, title:ev.title, date:ev.targetDate, end:end, st:st });
    });
    items.sort(function(a,b){ return a.end - b.end; });
    return items;
  }
  var depNext = null;
  function clockStr(){ var d = new Date(); return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
  function flapParts(ms){
    var t = Math.max(0, Math.floor(ms/1000));
    var d = Math.floor(t/86400), h = Math.floor((t%86400)/3600), m = Math.floor((t%3600)/60), s = t%60;
    return [ (d < 10 ? '0' : '') + d, pad(h), pad(m), pad(s) ];
  }
  function flapsHtml(parts){
    var labels = ['days','hrs','min','sec'];
    var idx = 0;
    return '<div class="flaps" aria-hidden="true">' + parts.map(function(p, gi){
      return '<div class="flap-grp"><div class="flap-digits">' + p.split('').map(function(c){
        var h = '<span class="flap" id="flap-'+idx+'">'+c+'</span>'; idx++; return h;
      }).join('') + '</div><div class="flap-lbl">'+labels[gi]+'</div></div>';
    }).join('') + '</div>';
  }
  function tickDepartures(){
    if (!depNext || !document.getElementById('flap-0')){ if (depTimer){ clearInterval(depTimer); depTimer = null; } return; }
    var chars = flapParts(depNext.end - Date.now()).join('').split('');
    if (!document.getElementById('flap-'+(chars.length-1)) || document.getElementById('flap-'+chars.length) || depNext.end <= Date.now()){
      var active = document.activeElement;
      if (!(active && active.tagName === 'INPUT' && root.contains(active))) render();
      return;
    }
    chars.forEach(function(c, i){ var el = document.getElementById('flap-'+i); if (el && el.textContent !== c) el.textContent = c; });
    var clk = document.getElementById('depClock'); if (clk) clk.textContent = clockStr();
  }
  function renderDepartures(){
    var items = departureItems();
    var now = Date.now();
    depNext = null;
    for (var i=0;i<items.length;i++){ if (items[i].end > now && items[i].st.key !== 'landed'){ depNext = items[i]; break; } }
    var rows = items.slice(0, 8).map(function(it){
      var d = new Date(it.date+'T00:00:00');
      var diff = (it.end - now)/86400000;
      var tm = diff >= 1 ? 'T-'+Math.floor(diff)+'D' : diff >= 0 ? 'T-'+Math.max(1, Math.ceil(diff*24))+'H' : 'T+'+Math.floor(-diff)+'D';
      if (it.st.key === 'landed') tm = 'DONE';
      var col = STATUS_DARK[it.st.key] || '#a9b4ad';
      return '<button class="dep-row" data-action="jump-goal" data-kind="'+it.kind+'" data-id="'+it.id+'">' +
        '<span class="nm">'+escapeHtml(it.title)+'</span>' +
        '<span class="sub"><span class="tm">'+tm+'</span> · '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()+'</span>' +
        '<span class="status'+(it.st.key === 'final' ? ' blink' : '')+'" style="color:'+col+'">'+it.st.label+'</span>' +
      '</button>';
    }).join('');
    var nextHtml;
    if (depNext){
      var left = depNext.end - now;
      var dd = Math.floor(left/86400000), hh = Math.floor((left%86400000)/3600000);
      nextHtml = '<div class="dep-next">'+escapeHtml(depNext.title)+'</div>' + flapsHtml(flapParts(left)) +
        '<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">'+dd+' days and '+hh+' hours left</span>';
    } else {
      nextHtml = '<div class="dep-next" style="color:#a9b4ad;font-size:15px;font-family:var(--font-body);font-weight:400;">No upcoming departures. Give a goal a target date to start its clock.</div>';
    }
    return '<div class="dep" style="position:relative;">' +
      '<div class="dep-top"><span class="dep-h">NEXT DEPARTURE</span><span class="dep-clock" id="depClock">'+clockStr()+'</span></div>' +
      nextHtml +
      rows +
      '<div class="dep-foot"><span style="font-size:11.5px;color:#a9b4ad;">Delayed means time is running ahead of work.</span>' +
        '<button class="coach-btn" data-action="coach-goals">'+speakerIcon()+'Status</button></div>' +
    '</div>';
  }

  function goalCard(g, type){
    var prog = goalProgress(g, type);
    var st = goalStatus(g, type);
    var canDelete = (!g.stats || !g.stats.planned) && !((g.steps || []).some(function(s){ return s.done; }));
    var targetDate = g.targetDate || '';
    var meta;
    if (targetDate){
      meta = 'target '+prettyDate(targetDate);
      if (type==='long' && g.targetLabel) meta += ' · '+escapeHtml(g.targetLabel);
    } else {
      meta = type==='long' ? (g.targetLabel ? escapeHtml(g.targetLabel) : 'no target set') : 'no date set';
    }
    var parentTag = '';
    if (type==='short' && g.parentGoalId){
      var p = findGoal({type:'long', id:g.parentGoalId});
      if(p) parentTag = ' · ladders to <b>'+escapeHtml(p.title)+'</b>';
    }

    var landed = st.key === 'landed';
    var stColor = STATUS_LIGHT[st.key] || '#5b6b60';
    var timerHtml = '';
    if (targetDate){
      var cd = formatCountdown(targetDate, null);
      var label;
      if (cd.text === 'today') label = landed ? 'done, was due today' : 'due today';
      else if (cd.passed) label = landed ? ('done, '+cd.text+' after the deadline') : (cd.text+' overdue');
      else label = (landed ? 'done with '+cd.text+' to spare' : cd.text+' left');
      timerHtml = '<div style="margin-top:10px;font-family:var(--font-mono);font-size:13px;font-weight:600;color:'+stColor+';">'+label+'</div>';
    }
    var workPct = Math.round(st.work*100);
    var wtHtml = '<div class="wt">' +
      '<div class="wt-labels"><span>work '+workPct+'% · '+st.workLabel+'</span>'+(st.time != null ? '<span>time used '+Math.round(st.time*100)+'%</span>' : '')+'</div>' +
      '<div class="wt-track"><div class="wt-fill" style="width:'+workPct+'%;background:'+stColor+'"></div>' +
        (st.time != null ? '<div class="wt-mark" style="left:'+Math.round(st.time*100)+'%" title="time used"></div>' : '') +
      '</div></div>';
    var steps = g.steps || [];
    var stepsHtml = '<div class="steps">' + steps.map(function(s){
      return '<div class="step-line">' +
        '<button class="step'+(s.done?' done':'')+'" data-action="toggle-step" data-id="'+g.id+'" data-type="'+type+'" data-step="'+s.id+'">' +
          '<span class="bx">'+CHECK_SVG+'</span><span class="lbl">'+escapeHtml(s.text)+'</span></button>' +
        (s.done ? '<span class="xp-chip" style="background:var(--teal-light);color:var(--teal);border-color:#bcd6cb;">+'+STEP_XP+'</span>' :
          '<button class="row-del" data-action="del-step" data-id="'+g.id+'" data-type="'+type+'" data-step="'+s.id+'" aria-label="Remove step">×</button>') +
      '</div>';
    }).join('') +
      (g.archived ? '' : '<div class="step-add"><input type="text" maxlength="80" placeholder="'+(steps.length ? 'Add another step' : 'Break it into steps (+'+STEP_XP+' xp each)')+'" data-step-input="'+g.id+'" data-type="'+type+'">' +
        '<button class="btn ghost small" data-action="add-step" data-id="'+g.id+'" data-type="'+type+'">Add</button></div>') +
    '</div>';

    return '' +
    '<div class="goal-card'+(g.archived?' archived':'')+'" id="goal-'+g.id+'" data-goal="'+g.id+'" data-type="'+type+'">' +
      '<div class="goal-top"><div><div class="goal-title">'+escapeHtml(g.title)+'</div>' +
      '<div class="goal-meta">'+meta+parentTag+'</div></div>' +
      '<span class="status" style="color:'+stColor+'">'+st.label+'</span></div>' +
      (g.description ? '<div class="goal-desc">'+escapeHtml(g.description)+'</div>' : '') +
      timerHtml +
      wtHtml +
      stepsHtml +
      '<div class="goal-actions">' +
        '<button class="link-btn" data-action="edit-goal" data-id="'+g.id+'" data-type="'+type+'">edit</button>' +
        '<button class="link-btn" data-action="archive-goal" data-id="'+g.id+'" data-type="'+type+'">'+(g.archived?'unarchive':'archive')+'</button>' +
        (canDelete ? '<button class="link-btn" data-action="delete-goal" data-id="'+g.id+'" data-type="'+type+'">delete</button>' : '') +
      '</div>' +
    '</div>';
  }

  function countdownCard(ev){
    var cd = formatCountdown(ev.targetDate, ev.targetTime);
    var meta = (cd.passed?'was ':'target ') + prettyDate(ev.targetDate) + (ev.targetTime? ' · '+ev.targetTime : '');
    var suffix = cd.text === 'today' ? '' : (cd.passed ? ' ago' : ' left');
    var days = daysUntil(ev.targetDate, ev.targetTime);
    var color = cd.passed ? 'var(--ink-soft)' : deadlineColor(days, false);
    return '' +
    '<div class="goal-card" id="event-'+ev.id+'" data-event="'+ev.id+'">' +
      '<div class="goal-top"><div><div class="goal-title">'+escapeHtml(ev.title)+'</div>' +
      '<div class="goal-meta">'+meta+'</div></div></div>' +
      (ev.note ? '<div class="goal-desc">'+escapeHtml(ev.note)+'</div>' : '') +
      '<div style="margin-top:10px;font-family:var(--font-mono);font-size:20px;font-weight:600;color:'+color+';">' +
        cd.text + suffix +
      '</div>' +
      '<div class="goal-actions">' +
        '<button class="link-btn" data-action="edit-event" data-id="'+ev.id+'">edit</button>' +
        '<button class="link-btn" data-action="delete-event" data-id="'+ev.id+'">delete</button>' +
      '</div>' +
    '</div>';
  }

  function renderGoals(){
    var lt = state.goals.longTerm, st = state.goals.shortTerm;
    var ltActive = lt.filter(function(g){return !g.archived;});
    var stActive = st.filter(function(g){return !g.archived;});
    var ltArchived = lt.filter(function(g){return g.archived;});
    var stArchived = st.filter(function(g){return g.archived;});

    var ltHtml = ltActive.length ? ltActive.map(function(g){return goalCard(g,'long');}).join('')
      : '<div class="empty" style="padding:24px;">No long-range goals yet.</div>';
    var stHtml = stActive.length ? stActive.map(function(g){return goalCard(g,'short');}).join('')
      : '<div class="empty" style="padding:24px;">No short-range goals yet.</div>';

    var archivedHtml = '';
    if (ltArchived.length || stArchived.length){
      archivedHtml = '<details style="margin-top:8px;"><summary class="section-sub" style="cursor:pointer;">Archived goals ('+(ltArchived.length+stArchived.length)+')</summary>' +
        ltArchived.map(function(g){return goalCard(g,'long');}).join('') +
        stArchived.map(function(g){return goalCard(g,'short');}).join('') +
        '</details>';
    }

    var evActive = state.events.filter(function(e){ return !formatCountdown(e.targetDate,e.targetTime).passed; })
      .sort(function(a,b){ return (a.targetDate+(a.targetTime||'00:00')) < (b.targetDate+(b.targetTime||'00:00')) ? -1:1; });
    var evPassed = state.events.filter(function(e){ return formatCountdown(e.targetDate,e.targetTime).passed; })
      .sort(function(a,b){ return a.targetDate > b.targetDate ? -1:1; });
    var evHtml = evActive.length ? evActive.map(countdownCard).join('') : '<div class="empty" style="padding:24px;">No countdowns yet.</div>';
    var evPassedHtml = evPassed.length ? '<details style="margin-top:8px;"><summary class="section-sub" style="cursor:pointer;">Past ('+evPassed.length+')</summary>'+evPassed.map(countdownCard).join('')+'</details>' : '';

    return '' +
      '<h2 class="section-title">Goals</h2>' +
      '<p class="section-sub">Every goal with a target date gets a clock. Break goals into steps and the board tells you whether work is keeping pace with time.</p>' +
      renderDepartures() +

      '<div class="goal-group">' +
        '<div class="goal-group-head"><h3 class="group-label">◆ Long-range</h3>' +
        '<button class="link-btn" data-action="show-form" data-form="long">+ new long-range goal</button></div>' +
        '<div id="longForm"></div>' +
        ltHtml +
      '</div>' +

      '<div class="goal-group">' +
        '<div class="goal-group-head"><h3 class="group-label">· Short-range</h3>' +
        '<button class="link-btn" data-action="show-form" data-form="short">+ new short-range goal</button></div>' +
        '<div id="shortForm"></div>' +
        stHtml +
      '</div>' +

      '<div class="goal-group">' +
        '<div class="goal-group-head"><h3 class="group-label">◷ Countdowns</h3>' +
        '<button class="link-btn" data-action="show-event-form">+ new countdown</button></div>' +
        '<div id="eventForm"></div>' +
        evHtml + evPassedHtml +
      '</div>' +

      archivedHtml;
  }

  function goalFormHtml(type, editing){
    var lt = state.goals.longTerm.filter(function(g){return !g.archived;});
    var parentOptions = lt.map(function(g){
      var sel = editing && editing.parentGoalId===g.id ? ' selected':'';
      return '<option value="'+g.id+'"'+sel+'>'+escapeHtml(g.title)+'</option>';

    var desc = editing ? escapeHtml(editing.description||'') : '';
    var extra = type==='long' ?
      '<div class="field-row">' +
        '<div><span class="field-label">Target date (drives the countdown)</span><input type="date" id="fDate" value="'+(editing?escapeHtml(editing.targetDate||''):'')+'"></div>' +
        '<div><span class="field-label">Label (optional)</span><input type="text" id="fTarget" placeholder="e.g. Q4 2026" value="'+(editing?escapeHtml(editing.targetLabel||''):'')+'"></div>' +
      '</div>'
      :
      '<div class="field-row">' +
        '<div><span class="field-label">Due date</span><input type="date" id="fDate" value="'+(editing?escapeHtml(editing.targetDate||''):'')+'"></div>' +
        '<div><span class="field-label">Ladders to (optional)</span><select id="fParent"><option value="">— none —</option>'+parentOptions+'</select></div>' +
      '</div>';
    return '' +
      '<div class="inline-form">' +
        '<div class="field-row"><div><span class="field-label">Title</span><input type="text" id="fTitle" maxlength="90" value="'+title+'" placeholder="What are you going for?"></div></div>' +
        extra +
        '<div class="field-row"><div><span class="field-label">Notes (optional)</span><input type="text" id="fDesc" value="'+desc+'"></div></div>' +
        '<div style="display:flex;gap:8px;"><button class="btn small" data-action="save-goal" data-type="'+type+'" data-editing="'+(editing?editing.id:'')+'">'+(editing?'Save changes':'Add goal')+'</button>' +
        '<button class="btn ghost small" data-action="cancel-form" data-form="'+type+'">Cancel</button></div>' +
      '</div>';

  function eventFormHtml(editing){
    var title = editing?escapeHtml(editing.title):'';
    var date = editing?escapeHtml(editing.targetDate||''):'';
    var time = editing?escapeHtml(editing.targetTime||''):'';
    var note = editing?escapeHtml(editing.note||''):'';
    return '' +
    '<div class="inline-form">' +
      '<div class="field-row"><div><span class="field-label">Title</span><input type="text" id="evTitle" maxlength="90" value="'+title+'" placeholder="What are you counting down to?"></div></div>' +
      '<div class="field-row">' +
        '<div><span class="field-label">Target date</span><input type="date" id="evDate" value="'+date+'"></div>' +
        '<div><span class="field-label">Time (optional)</span><input type="time" id="evTime" value="'+time+'"></div>' +
      '</div>' +

      '<div style="display:flex;gap:8px;"><button class="btn small" data-action="save-event" data-editing="'+(editing?editing.id:'')+'">'+(editing?'Save changes':'Add countdown')+'</button>' +
      '<button class="btn ghost small" data-action="cancel-event-form">Cancel</button></div>' +
    '</div>';
  }

  /* ---------------- Board (sticky notes) ---------------- */
  var NOTE_COLORS = [
    { id:'orange', hex:'#FFC58A', label:'People' },
    { id:'yellow', hex:'#FFE27A', label:'Personal' },
    { id:'pink', hex:'#FFB3C7', label:'Health' },
    { id:'mint', hex:'#A6E8C6', label:'Learning' },
    { id:'sky', hex:'#A9D2FF', label:'Career' }
  ];
  function noteColor(id){
    for (var i=0;i<NOTE_COLORS.length;i++){ if (NOTE_COLORS[i].id === id) return NOTE_COLORS[i]; }
    return NOTE_COLORS[1];
  }
  var TILTS = [-2.2, 1.6, 1.1, -1.5, 2, -1, 1.4, -1.8];
  function daysSince(iso){ return Math.floor((Date.now() - new Date(iso).getTime())/86400000); }
  function noteHtml(n, i){
    var c = noteColor(n.color);
    var peeled = !!n.doneAt;
    var tilt = TILTS[i % TILTS.length] * (peeled ? 1.8 : 1);
    var age = daysSince(n.createdAt);
    var ageTxt;
    if (peeled){ var kd = daysSince(n.doneAt); ageTxt = 'kept ' + (kd <= 0 ? 'today' : kd === 1 ? 'yesterday' : kd+' days ago'); }
    else ageTxt = age <= 0 ? 'pinned today' : age === 1 ? 'up 1 day' : 'up '+age+' days';
    var old = !peeled && age >= 7;
    var deletable = !peeled && (Date.now() - new Date(n.createdAt).getTime() < 86400000);
    return '<div class="note-wrap'+(peeled ? ' peeled' : '')+'" style="transform:rotate('+tilt.toFixed(1)+'deg)'+(peeled ? ' translateY(4px)' : '')+'">' +
      '<button class="note" style="background:'+c.hex+'" data-action="peel-note" data-id="'+n.id+'" aria-label="'+(peeled ? 'Put back up: ' : 'Mark kept: ')+escapeHtml(n.text)+'">' +
        '<span class="tape"></span>' +
        '<span><span class="txt">'+escapeHtml(n.text)+'</span>' + (n.who ? '<span class="who">for '+escapeHtml(n.who)+'</span>' : '') + '</span>' +
        '<span class="meta"><span>'+c.label+'</span><span'+(old ? ' class="old"' : '')+'>'+ageTxt+'</span></span>' +
        (peeled ? '<span class="stamp-done">KEPT</span>' : '') +
      '</button>' +
      (deletable ? '<button class="note-del" data-action="del-note" data-id="'+n.id+'" aria-label="Delete note">×</button>' : '') +
    '</div>';
  }
  function renderBoard(){
    var open = state.notes.filter(function(n){ return !n.doneAt; }).sort(function(a,b){ return a.createdAt < b.createdAt ? -1 : 1; });
    var kept = state.notes.filter(function(n){ return !!n.doneAt; }).sort(function(a,b){ return a.doneAt > b.doneAt ? -1 : 1; });
    var f = state.boardFilter;
    var shown = open.filter(function(n){ return f === 'all' || n.color === f; });
    var monthStart = state.today.slice(0,8)+'01';
    var keptMonth = kept.filter(function(n){ return toDateStr(new Date(n.doneAt)) >= monthStart; }).length;
    var overdue = open.filter(function(n){ return daysSince(n.createdAt) >= 7; }).length;

    var chips = '<div class="chip-row" role="group" aria-label="Filter notes by colour">' +
      '<button class="chip'+(f === 'all' ? ' on' : '')+'" data-action="board-filter" data-f="all" aria-pressed="'+(f === 'all')+'">All · '+open.length+'</button>' +
      NOTE_COLORS.map(function(c){
        var cnt = open.filter(function(x){ return x.color === c.id; }).length;
        return '<button class="chip'+(f === c.id ? ' on' : '')+'" data-action="board-filter" data-f="'+c.id+'" aria-pressed="'+(f === c.id)+'"><span class="sw" style="background:'+c.hex+'"></span>'+c.label+(cnt ? ' · '+cnt : '')+'</button>';
      }).join('') +
    '</div>';
    var swatches = '<div class="swatches" role="group" aria-label="Note colour">' + NOTE_COLORS.map(function(c){
      var on = state.noteColor === c.id;
      return '<button class="swatch'+(on ? ' on' : '')+'" data-action="note-color" data-c="'+c.id+'" aria-label="'+c.label+'" aria-pressed="'+on+'"><span style="background:'+c.hex+'"></span></button>';
    }).join('') + '</div>';

    return '' +
      '<h2 class="section-title">Board</h2>' +
      '<p class="section-sub">Promises and reminders that last longer than a day. Tap a note when it&#39;s kept to peel it off (+'+NOTE_XP+' xp). A note left up for a week turns its date red.</p>' +
      '<div class="composer">' +
        '<input type="text" id="noteText" maxlength="120" placeholder="What did you promise?" aria-label="Promise">' +
        '<input type="text" id="noteWho" maxlength="40" placeholder="To whom? (optional)" aria-label="To whom">' +
        '<div class="composer-bottom">'+swatches+'<button class="btn" data-action="pin-note">Pin it</button></div>' +
      '</div>' +
      '<p class="section-sub" style="margin:0 0 10px;">'+open.length+' up · '+keptMonth+' kept this month' +
        (overdue ? ' · <span style="color:var(--brick);font-weight:600;">'+overdue+' up for over a week</span>' : '')+'</p>' +
      chips +
      '<div class="board">' + (shown.length ? shown.map(noteHtml).join('') :
        '<div class="board-empty">'+(open.length ? 'No notes in this colour.' : 'Nothing pinned yet. Write down a promise you made to someone.')+'</div>') + '</div>' +
      (kept.length ? '<details class="peeled-box" id="keptBox"'+(state.keptOpen ? ' open' : '')+'><summary>Kept ('+kept.length+')</summary><div class="board">'+kept.slice(0, 40).map(noteHtml).join('')+'</div></details>' : '');
  }

  /* ---------------- Growth (compound balance + xp) ---------------- */
  function compoundSeries(summary){
    var vals = [1], ms = [], dates = [];
    summary.forEach(function(e){
      var r = e.plannedWeight > 0 ? e.completedWeight / e.plannedWeight : (e.planned > 0 ? e.completed / e.planned : 0);
      var m = 1 + 0.01 * (2*r - 1);
      ms.push(m); dates.push(e.date);
      vals.push(vals[vals.length-1] * m);
    });
    return { vals:vals, ms:ms, dates:dates };
  }
  function fmtX(x){ return x >= 100 ? x.toFixed(0) : x >= 10 ? x.toFixed(1) : x.toFixed(2); }
  function shortDate(ds){ var d = new Date(ds+'T00:00:00'); return d.getDate()+' '+MONTHS[d.getMonth()].charAt(0)+MONTHS[d.getMonth()].slice(1).toLowerCase(); }
  function renderGrowth(stats){
    var ser = compoundSeries(stats.summary);
    var n = ser.ms.length;
    var mToday = n ? ser.ms[n-1] : 0.99;
    var delta = (mToday - 1) * 100;
    var range = state.growthRange;
    var startIdx = range ? Math.max(0, n - range) : 0;
    var vs = ser.vals.slice(startIdx);
    var k = vs.length - 1;
    var v0 = vs[0];
    var ups = [], downs = [];
    for (var i=0;i<=k;i++){ ups.push(v0*Math.pow(1.01, i)); downs.push(v0*Math.pow(0.99, i)); }
    var lo = Math.min.apply(null, vs.concat(downs)), hi = Math.max.apply(null, vs.concat(ups));
    var padv = (hi - lo) * 0.08 || 0.02; lo -= padv; hi += padv;
    var W = 340, H = 168, X0 = 6, XW = 280, YT = 10, YH = 134;
    function x(i){ return X0 + (k ? i*XW/k : XW); }
    function y(v){ return YT + (hi - v)/(hi - lo)*YH; }
    function path(arr){ return arr.map(function(v, j){ return (j ? 'L' : 'M') + x(j).toFixed(1) + ' ' + y(v).toFixed(1); }).join(' '); }
    var labs = [
      { v: ups[k], txt: fmtX(ups[k])+'×', col:'#7e6018', w:500 },
      { v: vs[k], txt: fmtX(vs[k])+'×', col:'#1f5c4d', w:700 },
      { v: downs[k], txt: fmtX(downs[k])+'×', col:'#9c3b2c', w:500 }
    ];
    labs.forEach(function(l){ l.y = y(l.v) + 4; });
    labs.sort(function(a,b){ return a.y - b.y; });
    for (var j=1;j<labs.length;j++){ if (labs[j].y - labs[j-1].y < 12) labs[j].y = labs[j-1].y + 12; }
    var mono = 'ui-monospace, SF Mono, Menlo, monospace';
    var oneLine = (1 >= lo && 1 <= hi) ? '<line x1="'+X0+'" x2="'+(X0+XW)+'" y1="'+y(1).toFixed(1)+'" y2="'+y(1).toFixed(1)+'" stroke="#c7cdbe" stroke-dasharray="2 3"/>' : '';
    var svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Compound balance '+fmtX(vs[k])+' times, compared with gaining or losing 1% every day">' +
      oneLine +
      '<path d="'+path(ups)+'" fill="none" stroke="#a9822f" stroke-width="1.4" stroke-dasharray="4 4"/>' +
      '<path d="'+path(downs)+'" fill="none" stroke="#9c3b2c" stroke-width="1.4" stroke-dasharray="4 4"/>' +
      '<path d="'+path(vs)+'" fill="none" stroke="#1f5c4d" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="'+x(k).toFixed(1)+'" cy="'+y(vs[k]).toFixed(1)+'" r="4.5" fill="#1f5c4d" stroke="#fbfbf8" stroke-width="2"/>' +
      labs.map(function(l){ return '<text x="'+(X0+XW+8)+'" y="'+l.y.toFixed(1)+'" font-family="'+mono+'" font-size="10.5" font-weight="'+l.w+'" fill="'+l.col+'">'+l.txt+'</text>'; }).join('') +
      '<text x="'+X0+'" y="'+(H-3)+'" font-family="'+mono+'" font-size="10" fill="#5b6b60">'+(ser.dates[startIdx] ? shortDate(ser.dates[startIdx]) : '')+'</text>' +
      '<text x="'+(X0+XW)+'" y="'+(H-3)+'" text-anchor="end" font-family="'+mono+'" font-size="10" fill="#5b6b60">today</text>' +
    '</svg>';

    var recent = ser.ms.slice(-30);
    var geo = recent.length ? Math.exp(recent.reduce(function(s, m){ return s + Math.log(m); }, 0) / recent.length) : 1;
    var deltaUp = delta > 0.005, deltaDown = delta < -0.005;
    var deltaTxt = deltaUp ? '+'+delta.toFixed(2)+'%' : deltaDown ? '−'+Math.abs(delta).toFixed(2)+'%' : '±0.00%';
    var deltaStyle = deltaUp ? 'background:var(--teal-light);color:var(--teal);' : deltaDown ? 'background:var(--brick-light);color:var(--brick);' : 'background:var(--sheet-2);color:var(--ink-soft);';
    var segBtn = function(v, lbl){ return '<button class="'+(state.growthRange === v ? 'on' : '')+'" data-action="growth-range" data-r="'+v+'" aria-pressed="'+(state.growthRange === v)+'">'+lbl+'</button>'; };

    var L = levelInfo(stats.xp);
    var weekStart = addDays(state.today, -6);
    var xpWeek = 0;
    stats.summary.forEach(function(e){ if (e.date >= weekStart) xpWeek += entryXp(e); });
    var bars = [];
    for (var b=13;b>=0;b--){
      var dd = addDays(state.today, -b), ex = 0;
      for (var q=0;q<stats.summary.length;q++){ if (stats.summary[q].date === dd){ ex = entryXp(stats.summary[q]); break; } }
      bars.push({ date:dd, xp:ex, today: b === 0 });
    }
    var maxXp = Math.max.apply(null, bars.map(function(o){ return o.xp; }).concat([40]));
    var BW = 340, BH = 92, slot = BW/14;
    var barSvg = '<svg viewBox="0 0 '+BW+' '+BH+'" role="img" aria-label="Experience earned per day, last 14 days">' +
      bars.map(function(o, idx){
        var h = Math.round((o.xp/maxXp) * 64);
        var bx = idx*slot + 3, bw = slot - 6;
        return (h ? '<rect x="'+bx.toFixed(1)+'" y="'+(70-h)+'" width="'+bw.toFixed(1)+'" height="'+h+'" rx="2" fill="'+(o.today ? '#a9822f' : '#1f5c4d')+'"/>' : '<rect x="'+bx.toFixed(1)+'" y="68" width="'+bw.toFixed(1)+'" height="2" fill="#c7cdbe"/>') +
          ((idx % 2 === 1 || o.today) ? '<text x="'+(bx + bw/2).toFixed(1)+'" y="86" text-anchor="middle" font-family="'+mono+'" font-size="9" fill="#5b6b60">'+(o.today ? 'today' : new Date(o.date+'T00:00:00').getDate())+'</text>' : '');
      }).join('') +
    '</svg>';

    return '' +
      '<h2 class="section-title">Growth</h2>' +
      '<p class="section-sub">A fully kept day adds 1% to your balance and an empty day takes 1% away. Partial days land in between. It starts at 1.00× on your first logged day.</p>' +
      '<div class="group-label" style="font-size:11px;">Compound balance</div>' +
      '<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:4px;">' +
        '<div class="big-num">'+fmtX(ser.vals[n])+'×</div>' +
        '<span class="delta" style="'+deltaStyle+'">'+deltaTxt+' today</span>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;">' +
        '<div class="seg" role="group" aria-label="Chart range">'+segBtn(30,'30d')+segBtn(90,'90d')+segBtn(0,'All')+'</div>' +
        '<button class="coach-btn" data-action="coach-growth">'+speakerIcon()+'Coach</button>' +
      '</div>' +
      '<div class="chart-card">'+svg+
        '<div class="legend"><span><span style="width:14px;height:3px;background:#1f5c4d;border-radius:2px;"></span>You</span>' +
        '<span><span style="width:14px;border-top:2px dashed #a9822f;"></span>+1% every day</span>' +
